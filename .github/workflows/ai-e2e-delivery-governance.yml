name: JLMIRROR AI E2E Delivery Governance

on:
  pull_request:
    paths:
      - 'docs/00-foundation/ai-e2e-delivery/**'
      - 'implementation/e2e-delivery/**'
      - 'tools/assurance/validate_ai_e2e_delivery.py'
      - 'tools/assurance/test_validate_d4c_selection.py'
      - 'tests/assurance/test_ai_e2e_delivery.py'
      - '.github/workflows/ai-e2e-delivery-governance.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/00-foundation/ai-e2e-delivery/**'
      - 'implementation/e2e-delivery/**'
      - 'tools/assurance/validate_ai_e2e_delivery.py'
      - 'tools/assurance/test_validate_d4c_selection.py'
      - 'tests/assurance/test_ai_e2e_delivery.py'
      - '.github/workflows/ai-e2e-delivery-governance.yml'

permissions:
  contents: read

jobs:
  ai-e2e-delivery-governance:
    runs-on: ubuntu-24.04
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Resolve exact analyzed HEAD
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate AI E2E delivery governance
        run: python3 tools/assurance/validate_ai_e2e_delivery.py

      - name: Test AI E2E delivery governance
        run: python3 -m unittest tests.assurance.test_ai_e2e_delivery

      - name: Falsify AI E2E delivery governance
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_d4c_selection.py

      - name: Validate repository safety
        run: python3 tools/assurance/validate_repository.py
