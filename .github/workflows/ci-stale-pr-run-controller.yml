name: JLMIRROR CI Stale PR Run Controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: jlmirror-stale-pr-run-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-tests:
    name: Stale-run cancellation policy tests
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact analyzed HEAD read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile and falsify stale-run selection policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci/cancel_stale_pr_runs.py tools/ci/test_cancel_stale_pr_runs.py
          (cd tools/ci && python3 test_cancel_stale_pr_runs.py)

  cancel-stale-runs:
    name: Cancel obsolete runs for current PR
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CURRENT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch trusted controller from base commit without PR checkout
        id: trusted-controller
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/tools/ci/cancel_stale_pr_runs.py?ref=$BASE_SHA"
          http_code="$(curl --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/controller-response.json \
            -w '%{http_code}' \
            "$api")"
          if test "$http_code" = "404"; then
            echo 'trusted_controller_available=false' >> "$GITHUB_OUTPUT"
            echo 'bootstrap_run=true base_controller_not_yet_merged=true'
            exit 0
          fi
          test "$http_code" = "200"
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/controller-response.json').read_text())
          assert payload.get('encoding') == 'base64'
          encoded = payload.get('content')
          assert isinstance(encoded, str) and encoded
          decoded = base64.b64decode(encoded, validate=False)
          Path('/tmp/cancel_stale_pr_runs.py').write_bytes(decoded)
          PY
          python3 -m py_compile /tmp/cancel_stale_pr_runs.py
          echo 'trusted_controller_available=true' >> "$GITHUB_OUTPUT"

      - name: Cancel only conclusively stale same-PR runs
        if: steps.trusted-controller.outputs.trusted_controller_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/cancel_stale_pr_runs.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$CURRENT_PR_NUMBER" \
            --head-sha "$CURRENT_HEAD_SHA" \
            --head-branch "$CURRENT_HEAD_BRANCH" \
            --current-run-id "$GITHUB_RUN_ID" \
            --api-url "$GITHUB_API_URL" \
            --token "$GH_TOKEN"
