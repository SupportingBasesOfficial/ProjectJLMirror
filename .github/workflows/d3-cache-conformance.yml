name: JLMIRROR D3-B Session Cache Conformance Evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-cache-conformance:
    name: PostgreSQL 18.6 + Redis/Valkey authority continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POSTGRES_IMAGE: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      REDIS_IMAGE: redis@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
      VALKEY_IMAGE: valkey/valkey@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
      D3_NETWORK: jlmirror-d3-cache-conformance
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate unchanged D3 machine-owned authority state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('implementation/d3-identity-security/state-manifest.json').read_text())
          tracks = {track['track_id']: track for track in manifest['tracks']}
          assert tracks['D3-B']['state'] == 'candidate_selected_conformance_pending'
          assert set(tracks['D3-B']['evidence_remaining']) == {
              'session_authority_owner_boundaries',
              'revocation_partial_write_safety',
              'prepare_fence_commit_finalize_single_winner',
              'fleet_wide_cache_exclusion_barrier',
              'restore_failover_positive_authority_nonresurrection',
              'degraded_owner_read_bulkhead_fail_closed',
          }
          assert manifest['gate_state'] == 'candidate_evidence_running'
          assert manifest['wave4_implementation_authority'] == 'not_granted'
          assert manifest['production_authority'] == 'none'
          assert manifest['d4_transport_authority'] == 'not_selected_not_granted'
          print('d3_b_pre_conformance_manifest_boundary=PASS')
          PY

      - name: Validate final conformance harness structure and forbidden shortcuts
        shell: bash
        run: |
          set -euo pipefail
          core=implementation/d3-identity-security/harness/cache_authority_conformance_gate_runner.py
          entrypoint=implementation/d3-identity-security/harness/cache_authority_conformance_final_runner.py
          python3 -m py_compile "$core" "$entrypoint"
          for marker in \
            d3_b_session_authority_owner_boundaries \
            d3_b_revocation_partial_write_safety \
            d3_b_prepare_fence_commit_finalize_single_winner \
            d3_b_lease_issue_exclusion_serialization \
            d3_b_cleanup_takeover_actual_concurrency \
            d3_b_fleet_wide_cache_exclusion_barrier \
            d3_b_restore_failover_positive_authority_nonresurrection \
            d3_b_reentry_new_mutation_serialization \
            d3_b_degraded_owner_read_bulkhead_fail_closed \
            d3_b_cross_owner_transition_isolation \
            d3_b_session_cache_conformance_gate; do
            grep -F "$marker=PASS" "$core" >/dev/null
          done
          grep -F 'd3_b_lease_identity_rotation=PASS' "$entrypoint" >/dev/null
          grep -F 'd3_b_session_cache_conformance_final=PASS' "$entrypoint" >/dev/null
          grep -F 'class CommitPermit' "$core" >/dev/null
          grep -F 'preterminal_scope_release_impossible=true' "$core" >/dev/null
          grep -F 'reconciliation_requires_exact_non_authorizing_cache_state=true' "$core" >/dev/null
          grep -F '_ACTIVE_LOCAL_LEASE' "$entrypoint" >/dev/null
          grep -F 'predecessor_raw_negative_control_allow=true' "$entrypoint" >/dev/null
          grep -F 'REPLICAOF' "$core" >/dev/null
          grep -F '"pause", PG_CONTAINER' "$core" >/dev/null
          grep -F 'threading.Barrier' "$core" >/dev/null
          if grep -Eq 'wave4.*granted|production_authority.*granted|d4_transport_authority.*granted' "$core" "$entrypoint"; then
            echo 'D3-B evidence harness attempted to grant downstream authority' >&2
            exit 1
          fi

      - name: Pull immutable candidates and verify exact digests
        shell: bash
        run: |
          set -euo pipefail
          for image in "$POSTGRES_IMAGE" "$REDIS_IMAGE" "$VALKEY_IMAGE"; do
            case "$image" in
              *@sha256:*) ;;
              *) echo "mutable D3-B image reference is forbidden: $image" >&2; exit 1 ;;
            esac
            docker pull "$image"
            resolved="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            test "$resolved" = "$image"
            printf 'candidate_digest=%s\n' "$resolved"
          done

      - name: Start durable owner candidate and evidence network
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$D3_NETWORK"
          docker run -d --rm \
            --name jlmirror-d3-postgres-conformance \
            --network "$D3_NETWORK" \
            -e POSTGRES_PASSWORD=d3-postgres-password \
            -e POSTGRES_DB=d3 \
            "$POSTGRES_IMAGE"
          for _ in $(seq 1 120); do
            if docker exec jlmirror-d3-postgres-conformance pg_isready -U postgres -d d3 >/dev/null 2>&1; then
              test "$(docker exec -e PGPASSWORD=d3-postgres-password jlmirror-d3-postgres-conformance \
                psql -U postgres -d d3 -Atqc 'SELECT 1')" = "1"
              exit 0
            fi
            sleep 0.5
          done
          docker logs jlmirror-d3-postgres-conformance >&2 || true
          exit 1

      - name: Exercise Redis candidate authority and recovery conformance
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name jlmirror-d3-redis-conformance \
            --network "$D3_NETWORK" \
            "$REDIS_IMAGE" redis-server --save '' --appendonly no
          PG_CONTAINER=jlmirror-d3-postgres-conformance \
          CACHE_CONTAINER=jlmirror-d3-redis-conformance \
          CACHE_LABEL=redis_8_10_0 \
          CACHE_CLI=redis-cli \
          CACHE_IMAGE="$REDIS_IMAGE" \
          CACHE_SERVER=redis-server \
          DOCKER_NETWORK="$D3_NETWORK" \
            python3 implementation/d3-identity-security/harness/cache_authority_conformance_final_runner.py

      - name: Retire Redis evidence containers before substitution control
        if: always()
        shell: bash
        run: |
          docker rm -f \
            jlmirror-d3-redis-conformance \
            jlmirror-d3-redis-8-10-0-standby \
            jlmirror-d3-redis-8-10-0-restore \
            >/dev/null 2>&1 || true

      - name: Exercise Valkey substitution control with identical authority semantics
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name jlmirror-d3-valkey-conformance \
            --network "$D3_NETWORK" \
            "$VALKEY_IMAGE" valkey-server --save '' --appendonly no
          PG_CONTAINER=jlmirror-d3-postgres-conformance \
          CACHE_CONTAINER=jlmirror-d3-valkey-conformance \
          CACHE_LABEL=valkey_9_1_0 \
          CACHE_CLI=valkey-cli \
          CACHE_IMAGE="$VALKEY_IMAGE" \
          CACHE_SERVER=valkey-server \
          DOCKER_NETWORK="$D3_NETWORK" \
            python3 implementation/d3-identity-security/harness/cache_authority_conformance_final_runner.py

      - name: Preserve bounded D3-B evidence boundary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          printf 'd3_b_candidate_conformance_probe=PASS_PINNED_FINAL\n'
          printf 'postgres_digest=%s\n' "$POSTGRES_IMAGE"
          printf 'redis_digest=%s\n' "$REDIS_IMAGE"
          printf 'valkey_digest=%s\n' "$VALKEY_IMAGE"
          printf 'd3_b_manifest_credit=unchanged\n'
          printf 'c3_numerics=not_selected\n'
          printf 'd3=not_accepted wave4=not_granted production=none d4=not_selected_not_granted\n'

      - name: Capture conformance logs on failure
        if: failure()
        shell: bash
        run: |
          for container in \
            jlmirror-d3-postgres-conformance \
            jlmirror-d3-redis-conformance \
            jlmirror-d3-redis-8-10-0-standby \
            jlmirror-d3-redis-8-10-0-restore \
            jlmirror-d3-valkey-conformance \
            jlmirror-d3-valkey-9-1-0-standby \
            jlmirror-d3-valkey-9-1-0-restore; do
            docker logs "$container" 2>&1 || true
          done

      - name: Retire all evidence containers and network
        if: always()
        shell: bash
        run: |
          docker unpause jlmirror-d3-postgres-conformance >/dev/null 2>&1 || true
          docker rm -f \
            jlmirror-d3-postgres-conformance \
            jlmirror-d3-redis-conformance \
            jlmirror-d3-redis-8-10-0-standby \
            jlmirror-d3-redis-8-10-0-restore \
            jlmirror-d3-valkey-conformance \
            jlmirror-d3-valkey-9-1-0-standby \
            jlmirror-d3-valkey-9-1-0-restore \
            >/dev/null 2>&1 || true
          docker network rm "$D3_NETWORK" >/dev/null 2>&1 || true
