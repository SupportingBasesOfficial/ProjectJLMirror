name: JLMIRROR D3-E Final Recovery Hardening Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-recovery-hardening:
    name: Monotonic crypto witness + post-snapshot effect recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBAO_IMAGE: ghcr.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
      POSTGRES_IMAGE: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      PG_CONTAINER: jlmirror-d3e-final-postgres
      PG_PASSWORD: d3-postgres-password
      D3_NETWORK: jlmirror-d3e-final-hardening
      D3E_RECOVERY_WITNESS: /tmp/jlmirror-d3e-recovery-witness.json
      D3E_CRYPTO_WITNESS: /tmp/jlmirror-d3e-crypto-witness.json
      D3E_CRYPTO_MONOTONIC_ANCHOR: /tmp/jlmirror-d3e-crypto-monotonic-anchor.json

    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit and accepted bounded authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('implementation/d3-identity-security/state-manifest.json').read_text())
          tracks = {x['track_id']: x for x in manifest['tracks']}
          track = tracks['D3-E']
          required = set(track['required_evidence'])
          assert track['state'] == 'accepted_candidate'
          assert set(track['evidence_completed']) == required
          assert track['evidence_remaining'] == []
          assert {p['evidence_id'] for p in track['evidence_proofs']} == required
          assert all(tracks[track_id]['state'] == 'accepted_candidate' for track_id in tracks)
          assert manifest['gate_state'] == 'separately_accepted'
          assert manifest['canonical_product_implementation_authority'] == 'not_granted'
          assert manifest['wave4_implementation_authority'] == 'not_granted'
          assert manifest['production_authority'] == 'none'
          assert manifest['d4_transport_authority'] == 'not_selected_not_granted'
          assert 'OPEN-REL-016.B' in manifest['c3_remains_open']
          assert 'separate_acceptance' in manifest['acceptance_rule']
          print('d3_e_final_hardening_manifest_boundary=PASS state=accepted_candidate downstream_authority=unchanged')
          PY

      - name: Falsify hardening structure before execution
        shell: bash
        run: |
          set -euo pipefail
          dir=implementation/d3-identity-security/harness
          crypto="$dir/openbao_crypto_final_entrypoint.py"
          replay="$dir/replay_recovery_final_entrypoint.py"
          python3 -m py_compile \
            "$dir/openbao_crypto_conformance_runner.py" \
            "$dir/openbao_crypto_conformance_entrypoint.py" \
            "$crypto" \
            "$dir/replay_recovery_conformance_runner.py" \
            "$dir/replay_recovery_conformance_entrypoint.py" \
            "$replay"

          grep -F 'fcntl.flock' "$crypto" >/dev/null
          grep -F 'witness_epoch != anchor_epoch' "$crypto" >/dev/null
          grep -F 'valid_old_witness_rollback_fail_closed=true' "$crypto" >/dev/null
          grep -F 'concurrent_terminal_updates_preserved=true' "$crypto" >/dev/null
          grep -F 'production_anchor_topology_not_selected=true' "$crypto" >/dev/null

          grep -F '_rehydrate_missing_redrive_rows' "$replay" >/dev/null
          grep -F 'provider_reconfirmed_before_local_rebuild=true' "$replay" >/dev/null
          grep -F 'entire_local_redrive_row_lost=true' "$replay" >/dev/null
          grep -F 'completed_row_recreated_before_admission=true' "$replay" >/dev/null
          grep -F 'missing_local_state_not_interpreted_as_no_effect=true' "$replay" >/dev/null

          if grep -E 'd3_global=accepted|wave4=granted|production=(granted|eligible)|d4=(selected|granted)|manifest_credit=(granted|credited)' "$crypto" "$replay"; then
            echo 'hardening source must not grant downstream authority' >&2
            exit 1
          fi

      - name: Pull immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          for image in "$OPENBAO_IMAGE" "$POSTGRES_IMAGE"; do
            docker pull "$image"
            docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fx "$image" >/dev/null
          done

      - name: Start pinned PostgreSQL recovery authority
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$D3_NETWORK"
          docker run -d --rm --name "$PG_CONTAINER" --network "$D3_NETWORK" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB=d3 "$POSTGRES_IMAGE"
          for _ in $(seq 1 120); do
            if result="$(docker exec -e PGPASSWORD="$PG_PASSWORD" "$PG_CONTAINER" \
              psql -U postgres -d d3 -Atqc 'SELECT 1' 2>/dev/null)" && test "$result" = "1"; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$PG_CONTAINER" >&2 || true
          exit 1

      - name: Prove rollback-detecting serialized crypto continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 implementation/d3-identity-security/harness/openbao_crypto_final_entrypoint.py | tee /tmp/d3e-final-crypto.log
          grep -F 'd3_e_historical_verifier_relocation_recovery_continuity=PASS' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'd3_e_retired_erased_key_nonresurrection=PASS' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'd3_e_key_generation_rotation_retirement=PASS' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'd3_e_crypto_continuity_monotonic_concurrency=PASS' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'valid_old_witness_rollback_fail_closed=true' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'interprocess_flock=true' /tmp/d3e-final-crypto.log >/dev/null
          grep -F 'concurrent_terminal_updates_preserved=true' /tmp/d3e-final-crypto.log >/dev/null

      - name: Prove lost post-snapshot provider outcome rehydration
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD="$PG_PASSWORD" "$PG_CONTAINER" \
            psql -U postgres -d d3 -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS d3e_crypto_control CASCADE;'
          python3 implementation/d3-identity-security/harness/replay_recovery_final_entrypoint.py | tee /tmp/d3e-final-replay.log
          grep -F 'd3_e_replay_consumed_identity_survives_restore_loss=PASS' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'd3_e_external_provider_restart_durability=PASS' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'd3_e_recovery_capture_inflight_provider_fence=PASS' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'd3_e_post_snapshot_provider_outcome_rehydration=PASS' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'd3_e_post_snapshot_redrive_row_rehydration=PASS' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'external_provider_reconfirmed=true' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'completed_row_recreated_before_admission=true' /tmp/d3e-final-replay.log >/dev/null
          grep -F 'exact_effect_not_repeated=true' /tmp/d3e-final-replay.log >/dev/null

      - name: Preserve accepted bounded authority boundary
        shell: bash
        run: |
          set -euo pipefail
          printf 'd3_e_final_recovery_hardening=PASS\n'
          printf 'manifest_state=accepted_candidate d3=separately_accepted wave4=not_granted production=none d4=not_selected_not_granted\n'
          printf 'c3_numerics=not_selected production_anchor_topology=not_selected\n'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f jlmirror-d3e-openbao-source jlmirror-d3e-openbao-target "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker volume rm -f jlmirror-d3e-openbao-source-data jlmirror-d3e-openbao-target-data jlmirror-d3e-openbao-stale-data >/dev/null 2>&1 || true
          docker network rm "$D3_NETWORK" >/dev/null 2>&1 || true
          rm -f "$D3E_RECOVERY_WITNESS" "$D3E_CRYPTO_WITNESS" "$D3E_CRYPTO_MONOTONIC_ANCHOR" \
            "${D3E_CRYPTO_MONOTONIC_ANCHOR}.provisioned" "${D3E_CRYPTO_MONOTONIC_ANCHOR}.lock" \
            /tmp/jlmirror-d3e-provider-state.json /tmp/jlmirror-d3e-provider-state.json.provisioned \
            /tmp/jlmirror-d3e-openbao.hcl /tmp/d3e-final-crypto.log /tmp/d3e-final-replay.log
