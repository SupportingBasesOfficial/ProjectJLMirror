name: JLMIRROR D3 Identity/Security Evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3-reference-contracts:
    name: D3 reference security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate D3 machine-owned state
        shell: bash
        run: python3 tools/assurance/validate_d3_identity_security_state.py .

      - name: Compile D3 reference harness
        shell: bash
        run: python3 -m py_compile implementation/d3-identity-security/harness/crypto_reference.py

      - name: Falsify D3-C and D3-E reference profiles
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=implementation/d3-identity-security/harness \
            python3 implementation/d3-identity-security/harness/test_crypto_reference.py

      - name: Preserve accepted D3 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('implementation/d3-identity-security/state-manifest.json').read_text())
          assert state['gate_state'] == 'separately_accepted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert 'separate_acceptance' in state['acceptance_rule']
          tracks = {item['track_id']: item for item in state['tracks']}

          for track_id in ('D3-A', 'D3-B', 'D3-C', 'D3-D', 'D3-E'):
              track = tracks[track_id]
              assert track['state'] == 'accepted_candidate'
              assert set(track['evidence_completed']) == set(track['required_evidence'])
              assert track['evidence_remaining'] == []
              assert {proof['evidence_id'] for proof in track['evidence_proofs']} == set(track['required_evidence'])

          print(
              'd3_reference_evidence=PASS authority=bounded '
              'all_tracks=accepted_candidate d3_global=separately_accepted '
              'wave4=not_granted production=none d4=not_selected_not_granted'
          )
          PY
