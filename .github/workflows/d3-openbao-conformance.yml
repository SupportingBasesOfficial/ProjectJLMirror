name: JLMIRROR D3-E Crypto Replay Conformance Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/d3-openbao-conformance.yml"
      - "implementation/d3-identity-security/harness/crypto_replay_conformance_runner.py"
      - "implementation/d3-identity-security/state-manifest.json"
      - "tools/assurance/validate_d3_identity_security_state.py"
      - "tools/assurance/validate_d3_identity_security_state_legacy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-e-crypto-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openbao-replay-conformance:
    name: OpenBao 2.6.2 + PostgreSQL replay continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBAO_IMAGE: ghcr.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
      POSTGRES_IMAGE: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      D3E_NETWORK: jlmirror-d3e-conformance
      PG_PASSWORD: d3e-postgres-password
      OPENBAO_TOKEN: d3e-root

    steps:
      - name: Checkout exact reviewed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit and source-only D3-E boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("implementation/d3-identity-security/state-manifest.json").read_text())
          t = {x["track_id"]: x for x in m["tracks"]}["D3-E"]
          expected_remaining = {
              "historical_verifier_relocation_recovery_continuity",
              "retired_erased_key_nonresurrection",
              "private_key_jwt_replay_atomic_single_winner",
              "replay_partition_fail_closed",
              "replay_consumed_identity_survives_restore_loss",
              "key_generation_rotation_retirement",
          }
          assert t["state"] == "candidate_selected_conformance_pending"
          assert set(t["evidence_remaining"]) == expected_remaining
          assert len(t["evidence_completed"]) == 3
          assert len(t["evidence_proofs"]) == 3
          assert m["gate_state"] == "candidate_evidence_running"
          assert m["wave4_implementation_authority"] == "not_granted"
          assert m["production_authority"] == "none"
          assert m["d4_transport_authority"] == "not_selected_not_granted"
          print("d3_e_source_manifest_boundary=PASS")
          PY

      - name: Validate conformance runner structure
        shell: bash
        run: |
          set -euo pipefail
          runner=implementation/d3-identity-security/harness/crypto_replay_conformance_runner.py
          python3 -m py_compile "$runner"
          for marker in \
            d3_e_historical_verifier_relocation_recovery_continuity \
            d3_e_retired_erased_key_nonresurrection \
            d3_e_private_key_jwt_replay_atomic_single_winner \
            d3_e_replay_partition_fail_closed \
            d3_e_replay_consumed_identity_survives_restore_loss \
            d3_e_key_generation_rotation_retirement \
            d3_e_provider_neutral_runtime_boundary \
            d3_e_crypto_replay_conformance; do
            grep -F "$marker=PASS" "$runner" >/dev/null
          done
          grep -F "recovery_blocked" "$runner" >/dev/null
          grep -F "FOR UPDATE" "$runner" >/dev/null
          grep -F "ON CONFLICT DO NOTHING" "$runner" >/dev/null
          grep -F "soft-delete-restore" "$runner" >/dev/null
          grep -F "HistoricalVerifierPort" "$runner" >/dev/null
          grep -F "KeyAuthorityPort" "$runner" >/dev/null
          grep -F "c3_numerics_topology_not_selected=true" "$runner" >/dev/null

      - name: Pull immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          for image in "$OPENBAO_IMAGE" "$POSTGRES_IMAGE"; do
            case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
            docker pull "$image"
            test "$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')" = "$image"
          done

      - name: Start isolated security authorities
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$D3E_NETWORK"
          docker run -d --rm \
            --name jlmirror-d3e-replay \
            --network "$D3E_NETWORK" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB=d3e \
            "$POSTGRES_IMAGE"
          docker run -d --rm \
            --name jlmirror-d3e-control \
            --network "$D3E_NETWORK" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB=d3e \
            "$POSTGRES_IMAGE"

          for container in jlmirror-d3e-replay jlmirror-d3e-control; do
            ready=false
            for _ in $(seq 1 120); do
              if result="$(docker exec -e PGPASSWORD="$PG_PASSWORD" "$container" \
                psql -U postgres -d d3e -Atqc 'SELECT 1' 2>/dev/null)" && test "$result" = "1"; then
                ready=true
                break
              fi
              sleep 0.5
            done
            test "$ready" = true
          done

          docker run -d --rm \
            --name jlmirror-d3e-openbao \
            --network "$D3E_NETWORK" \
            -p 8200:8200 \
            "$OPENBAO_IMAGE" \
            server -dev \
            -dev-root-token-id="$OPENBAO_TOKEN" \
            -dev-listen-address=0.0.0.0:8200 \
            -dev-no-store-token

          ready=false
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if test "$ready" != true; then
            docker logs jlmirror-d3e-openbao >&2 || true
            exit 1
          fi
          docker exec jlmirror-d3e-openbao bao version | grep -F "OpenBao v2.6.2" >/dev/null

      - name: Execute D3-E cryptographic replay conformance
        shell: bash
        env:
          PG_REPLAY_CONTAINER: jlmirror-d3e-replay
          PG_CONTROL_CONTAINER: jlmirror-d3e-control
          OPENBAO_ADDR: http://127.0.0.1:8200
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/d3-e-conformance.log"
          python3 implementation/d3-identity-security/harness/crypto_replay_conformance_runner.py | tee "$log"

          for marker in \
            d3_e_historical_verifier_relocation_recovery_continuity \
            d3_e_retired_erased_key_nonresurrection \
            d3_e_private_key_jwt_replay_atomic_single_winner \
            d3_e_replay_partition_fail_closed \
            d3_e_replay_consumed_identity_survives_restore_loss \
            d3_e_key_generation_rotation_retirement \
            d3_e_provider_neutral_runtime_boundary \
            d3_e_crypto_replay_conformance; do
            grep -F "$marker=PASS" "$log" >/dev/null
          done

          grep -F "native_restore_negative_control_usable=true" "$log" >/dev/null
          grep -F "exactly_one_winner=true" "$log" >/dev/null
          grep -F "actual_authority_pause=true" "$log" >/dev/null
          grep -F "consumed_identity_not_resurrected_as_unused=true" "$log" >/dev/null
          grep -F "c3_numerics_topology_not_selected=true" "$log" >/dev/null

      - name: Preserve bounded source-evidence result
        shell: bash
        run: |
          set -euo pipefail
          printf 'd3_e_candidate_conformance_probe=PASS_PINNED_SOURCE_ONLY\n'
          printf 'manifest_credit=unchanged candidate_state=candidate_selected_conformance_pending\n'
          printf 'openbao=2.6.2 replay_authority=postgresql_security_continuity\n'
          printf 'd3=not_accepted wave4=not_granted production=none d4=not_selected_not_granted\n'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker unpause jlmirror-d3e-control >/dev/null 2>&1 || true
          docker rm -f \
            jlmirror-d3e-openbao \
            jlmirror-d3e-replay \
            jlmirror-d3e-control >/dev/null 2>&1 || true
          docker network rm "$D3E_NETWORK" >/dev/null 2>&1 || true
