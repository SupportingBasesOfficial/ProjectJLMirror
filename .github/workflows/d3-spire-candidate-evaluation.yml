name: JLMIRROR D3-D SPIRE Candidate Evaluation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spire-candidate-evaluation:
    name: SPIRE 1.15.3 bounded workload-identity evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SPIRE_VERSION: 1.15.3
      SPIRE_ASSET_URL: https://github.com/spiffe/spire/releases/download/v1.15.3/spire-1.15.3-linux-amd64-musl.tar.gz
      SPIRE_ASSET_SHA256: ca1a4d1155317bdd2afc7f36663828a10410c7c840e54725b90b4064b0a301c7
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate current D3 machine-owned state without promoting candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('implementation/d3-identity-security/state-manifest.json').read_text())
          tracks = {item['track_id']: item for item in state['tracks']}
          d3d = tracks['D3-D']
          assert d3d['candidate'] == 'spire_1_15_2'
          assert d3d['state'] == 'candidate_selected_conformance_pending'
          assert d3d['evidence_completed'] == []
          assert len(d3d['evidence_remaining']) == len(d3d['required_evidence']) == 8
          assert state['gate_state'] == 'candidate_evidence_running'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          print('d3_d_candidate_replacement_evaluation=AUTHORIZED_AS_EVIDENCE_ONLY current_candidate_unchanged=true')
          PY

      - name: Validate candidate probe structure
        shell: bash
        run: |
          set -euo pipefail
          bash -n implementation/d3-identity-security/harness/spire_candidate_probe.sh
          grep -F 'conformance_claim=exploratory_only' implementation/d3-identity-security/harness/spire_candidate_probe.sh >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_candidate_probe.sh >/dev/null
          if grep -F 'conformance_claim=complete' implementation/d3-identity-security/harness/spire_candidate_probe.sh >/dev/null; then
            echo 'SPIRE candidate evaluation attempted to claim complete D3-D conformance' >&2
            exit 1
          fi

      - name: Download immutable SPIRE release and verify official digest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spire-${SPIRE_VERSION}.tar.gz"
          extract_dir="$RUNNER_TEMP/spire-candidate"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            "$SPIRE_ASSET_URL" -o "$archive"
          printf '%s  %s\n' "$SPIRE_ASSET_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$extract_dir"
          spire_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -name "spire-${SPIRE_VERSION}" -print -quit)"
          test -n "$spire_root"
          test -x "$spire_root/bin/spire-server"
          test -x "$spire_root/bin/spire-agent"
          printf 'candidate_release=%s\n' "$SPIRE_ASSET_URL"
          printf 'candidate_sha256=sha256:%s\n' "$SPIRE_ASSET_SHA256"
          printf 'spire_root=%s\n' "$spire_root" >> "$GITHUB_OUTPUT"

      - name: Exercise real server agent attestation and Workload API boundary
        shell: bash
        env:
          SPIRE_ROOT: ${{ steps.candidate.outputs.spire_root }}
          WORK_DIR: ${{ runner.temp }}/jlmirror-d3-spire
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          SPIRE_VERSION="$SPIRE_VERSION" \
            bash implementation/d3-identity-security/harness/spire_candidate_probe.sh

      - name: Preserve non-authority and candidate-evaluation boundary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          printf 'd3_d_spire_1_15_3_candidate=PASS_EVALUATION_ONLY\n'
          printf 'candidate_release_sha256=sha256:%s\n' "$SPIRE_ASSET_SHA256"
          printf 'canonical_candidate_promoted=false evidence_credited=false d3_d_conformed=false\n'
          printf 'private_key_non_exportability=unproven issuer_restore_recovery=unproven vendor_adapter=unproven\n'
          printf 'wave4=not_granted production=none d4=not_selected_not_granted\n'

      - name: Capture SPIRE candidate logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          for log in "$RUNNER_TEMP"/jlmirror-d3-spire/*.log; do
            test -f "$log" || continue
            printf '\n===== %s =====\n' "$log"
            tail -n 250 "$log"
          done

      - name: Remove ephemeral SPIRE evidence material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/jlmirror-d3-spire" "$RUNNER_TEMP/spire-candidate" "$RUNNER_TEMP/spire-${SPIRE_VERSION}.tar.gz"
