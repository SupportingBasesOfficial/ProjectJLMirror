name: JLMIRROR D3-D SPIRE Candidate Evaluation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spire-candidate-evaluation:
    name: SPIRE 1.15.3 bounded workload-identity evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SPIRE_VERSION: 1.15.3
      SPIRE_ASSET_URL: https://github.com/spiffe/spire/releases/download/v1.15.3/spire-1.15.3-linux-amd64-musl.tar.gz
      SPIRE_ASSET_SHA256: ca1a4d1155317bdd2afc7f36663828a10410c7c840e54725b90b4064b0a301c7
      SPIRE_ARTIFACT_PIN: spire-1.15.3-linux-amd64-musl.tar.gz@sha256:ca1a4d1155317bdd2afc7f36663828a10410c7c840e54725b90b4064b0a301c7
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate current D3 machine-owned pinned candidate state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path('implementation/d3-identity-security/state-manifest.json').read_text())
          tracks = {item['track_id']: item for item in state['tracks']}
          d3d = tracks['D3-D']
          expected_completed = {
              'runtime_attestation_not_caller_identity',
              'trust_domain_environment_runtime_binding',
              'short_lived_rotation_retired_bundle_rejection',
              'cross_environment_rejection',
              'workload_identity_non_tenant_authority',
              'private_key_non_exportability_profile',
              'issuer_restore_retired_authority_nonresurrection',
              'vendor_credential_adapter_least_privilege',
          }
          expected_remaining = set()
          assert d3d['candidate'] == 'spire_1_15_3'
          assert d3d['candidate_artifact_digest'] == os.environ['SPIRE_ARTIFACT_PIN']
          assert d3d['state'] == 'per_track_conformed'
          assert set(d3d['evidence_completed']) == expected_completed
          assert set(d3d['evidence_remaining']) == expected_remaining
          assert len(d3d['evidence_proofs']) == 8
          assert state['gate_state'] == 'candidate_evidence_running'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          print('d3_d_candidate_state=PINNED_CONFORMED_EVIDENCE completed=8 remaining=0 auto_credit=false')
          PY

      - name: Validate candidate probe structure
        shell: bash
        run: |
          set -euo pipefail
          bash -n implementation/d3-identity-security/harness/spire_candidate_probe.sh
          bash -n implementation/d3-identity-security/harness/spire_rotation_probe.sh
          bash -n implementation/d3-identity-security/harness/spire_private_key_profile_probe.sh
          python3 -m py_compile \
            implementation/d3-identity-security/harness/spire_non_tenant_authority_probe.py \
            implementation/d3-identity-security/harness/spire_restore_nonresurrection_probe.py \
            implementation/d3-identity-security/harness/spire_vendor_credential_adapter_probe.py
          grep -F 'conformance_claim=exploratory_only' implementation/d3-identity-security/harness/spire_candidate_probe.sh >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_candidate_probe.sh >/dev/null
          grep -F 'rotation_retired_bundle=PASS' implementation/d3-identity-security/harness/spire_rotation_probe.sh >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_rotation_probe.sh >/dev/null
          grep -F 'workload_identity_non_tenant_authority=PASS' implementation/d3-identity-security/harness/spire_non_tenant_authority_probe.py >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_non_tenant_authority_probe.py >/dev/null
          grep -F 'private_key_non_exportability_profile=PASS' implementation/d3-identity-security/harness/spire_private_key_profile_probe.sh >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_private_key_profile_probe.sh >/dev/null
          grep -F 'issuer_restore_retired_authority_nonresurrection=PASS' implementation/d3-identity-security/harness/spire_restore_nonresurrection_probe.py >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_restore_nonresurrection_probe.py >/dev/null
          grep -F 'vendor_credential_adapter_least_privilege=PASS' implementation/d3-identity-security/harness/spire_vendor_credential_adapter_probe.py >/dev/null
          grep -F 'evidence_credited=false' implementation/d3-identity-security/harness/spire_vendor_credential_adapter_probe.py >/dev/null
          if grep -F 'conformance_claim=complete' \
              implementation/d3-identity-security/harness/spire_candidate_probe.sh \
              implementation/d3-identity-security/harness/spire_rotation_probe.sh \
              implementation/d3-identity-security/harness/spire_private_key_profile_probe.sh \
              implementation/d3-identity-security/harness/spire_non_tenant_authority_probe.py \
              implementation/d3-identity-security/harness/spire_restore_nonresurrection_probe.py \
              implementation/d3-identity-security/harness/spire_vendor_credential_adapter_probe.py >/dev/null; then
            echo 'SPIRE evidence probe attempted to grant D3-D conformance directly' >&2
            exit 1
          fi

      - name: Download immutable SPIRE release and verify official digest
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/spire-${SPIRE_VERSION}.tar.gz"
          extract_dir="$RUNNER_TEMP/spire-candidate"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            "$SPIRE_ASSET_URL" -o "$archive"
          printf '%s  %s\n' "$SPIRE_ASSET_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$extract_dir"
          spire_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -name "spire-${SPIRE_VERSION}" -print -quit)"
          test -n "$spire_root"
          test -x "$spire_root/bin/spire-server"
          test -x "$spire_root/bin/spire-agent"
          printf 'candidate_release=%s\n' "$SPIRE_ASSET_URL"
          printf 'candidate_sha256=sha256:%s\n' "$SPIRE_ASSET_SHA256"
          printf 'spire_root=%s\n' "$spire_root" >> "$GITHUB_OUTPUT"

      - name: Exercise real server agent attestation and Workload API boundary
        shell: bash
        env:
          SPIRE_ROOT: ${{ steps.candidate.outputs.spire_root }}
          WORK_DIR: ${{ runner.temp }}/jlmirror-d3-spire
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          SPIRE_VERSION="$SPIRE_VERSION" \
            bash implementation/d3-identity-security/harness/spire_candidate_probe.sh

      - name: Prove workload identity cannot grant tenant authority
        shell: bash
        env:
          SPIRE_EVIDENCE_DIR: ${{ runner.temp }}/jlmirror-d3-spire/output
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 implementation/d3-identity-security/harness/spire_non_tenant_authority_probe.py

      - name: Exercise least-privilege vendor credential adapter boundary
        shell: bash
        env:
          SPIRE_EVIDENCE_DIR: ${{ runner.temp }}/jlmirror-d3-spire/output
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 implementation/d3-identity-security/harness/spire_vendor_credential_adapter_probe.py

      - name: Exercise non-exporting agent SVID signer boundary
        shell: bash
        env:
          SPIRE_ROOT: ${{ steps.candidate.outputs.spire_root }}
          WORK_DIR: ${{ runner.temp }}/jlmirror-d3-spire-key-profile
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          SPIRE_VERSION="$SPIRE_VERSION" \
            bash implementation/d3-identity-security/harness/spire_private_key_profile_probe.sh

      - name: Exercise X.509 rotation and retired-bundle lifecycle
        shell: bash
        env:
          SPIRE_ROOT: ${{ steps.candidate.outputs.spire_root }}
          WORK_DIR: ${{ runner.temp }}/jlmirror-d3-spire-rotation
        run: |
          set -euo pipefail
          rm -rf "$WORK_DIR"
          SPIRE_VERSION="$SPIRE_VERSION" \
            bash implementation/d3-identity-security/harness/spire_rotation_probe.sh

      - name: Prove restored SPIRE authority cannot resurrect retired authority
        shell: bash
        env:
          SPIRE_ROOT: ${{ steps.candidate.outputs.spire_root }}
          SPIRE_ROTATION_EVIDENCE_DIR: ${{ runner.temp }}/jlmirror-d3-spire-rotation
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 implementation/d3-identity-security/harness/spire_restore_nonresurrection_probe.py

      - name: Preserve conformed D3-D ledger and non-authority boundary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          printf 'd3_d_spire_1_15_3_candidate=PASS_PINNED_CONFORMED_EVIDENCE\n'
          printf 'candidate_artifact_pin=%s\n' "$SPIRE_ARTIFACT_PIN"
          printf 'canonical_candidate_promoted=true ledger_evidence_credited=8 current_run_auto_credit=false d3_d_conformed=true\n'
          printf 'rotation_evidence_provenance=run_12_pinned current_run_ledger_change=false\n'
          printf 'non_tenant_authority_evidence_provenance=run_15_pinned current_run_ledger_change=false\n'
          printf 'private_key_profile_evidence_provenance=run_24_pinned current_run_ledger_change=false\n'
          printf 'restore_nonresurrection_evidence_provenance=run_43_pinned current_run_ledger_change=false\n'
          printf 'vendor_credential_adapter_evidence_provenance=run_43_pinned current_run_ledger_change=false\n'
          printf 'remaining_evidence=none\n'
          printf 'd3_gate=candidate_evidence_running wave4=not_granted production=none d4=not_selected_not_granted\n'

      - name: Capture SPIRE candidate logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          for log in \
              "$RUNNER_TEMP"/jlmirror-d3-spire/*.log \
              "$RUNNER_TEMP"/jlmirror-d3-spire-key-profile/*.log \
              "$RUNNER_TEMP"/jlmirror-d3-spire-key-profile/run/*.log \
              "$RUNNER_TEMP"/jlmirror-d3-spire-rotation/*.log \
              "$RUNNER_TEMP"/jlmirror-d3-spire-rotation/actual-provider-restore/*.log; do
            test -f "$log" || continue
            printf '\n===== %s =====\n' "$log"
            tail -n 250 "$log"
          done

      - name: Remove ephemeral SPIRE evidence material
        if: always()
        shell: bash
        run: |
          set +e
          for path in \
            "$RUNNER_TEMP/jlmirror-d3-spire" \
            "$RUNNER_TEMP/jlmirror-d3-spire-key-profile" \
            "$RUNNER_TEMP/jlmirror-d3-spire-rotation" \
            "$RUNNER_TEMP/spire-candidate"; do
            if [[ -d "$path" ]]; then
              chmod -R u+w "$path" >/dev/null 2>&1 || true
            fi
          done
          rm -rf \
            "$RUNNER_TEMP/jlmirror-d3-spire" \
            "$RUNNER_TEMP/jlmirror-d3-spire-key-profile" \
            "$RUNNER_TEMP/jlmirror-d3-spire-rotation" \
            "$RUNNER_TEMP/spire-candidate" \
            "$RUNNER_TEMP/spire-${SPIRE_VERSION}.tar.gz"
