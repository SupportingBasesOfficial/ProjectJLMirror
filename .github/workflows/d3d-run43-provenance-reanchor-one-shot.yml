name: JLMIRROR D3-D One-shot Run 43 Provenance Reanchor

on:
  push:
    branches:
      - evidence/d3-d-workload-identity-c2

permissions:
  contents: write

jobs:
  normalize:
    if: "${{ github.event.head_commit.message == 'assurance(D3-D): normalize exact run-43 provenance diff' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/d3-d-workload-identity-c2
          fetch-depth: 0

      - name: Normalize reanchor to exact semantic delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          evidence_base = '44cd732320b98e2d28c6027f9abd17488a6cb25a'

          manifest_path = Path('implementation/d3-identity-security/state-manifest.json')
          manifest = subprocess.check_output(
              ['git', 'show', f'{evidence_base}:{manifest_path.as_posix()}'], text=True
          )
          old_manifest = '''          "evidence_sha": "c8ac05c4bcea367949489c94dfe876605e2f4261",
          "workflow_run_id": 33342690140,
          "workflow_run_number": 38,'''
          new_manifest = '''          "evidence_sha": "44cd732320b98e2d28c6027f9abd17488a6cb25a",
          "workflow_run_id": 33344277084,
          "workflow_run_number": 43,'''
          if manifest.count(old_manifest) != 2:
              raise SystemExit('refusing normalization: baseline manifest provenance cardinality drifted')
          manifest_path.write_text(manifest.replace(old_manifest, new_manifest), encoding='utf-8')

          validator_path = Path('tools/assurance/validate_d3_identity_security_state.py')
          validator = subprocess.check_output(
              ['git', 'show', f'{evidence_base}:{validator_path.as_posix()}'], text=True
          )
          old_validator = '''    "evidence_sha": "c8ac05c4bcea367949489c94dfe876605e2f4261",
    "workflow_run_id": 33342690140,
    "workflow_run_number": 38,'''
          new_validator = '''    "evidence_sha": "44cd732320b98e2d28c6027f9abd17488a6cb25a",
    "workflow_run_id": 33344277084,
    "workflow_run_number": 43,'''
          if validator.count(old_validator) != 1:
              raise SystemExit('refusing normalization: baseline validator provenance cardinality drifted')
          validator_path.write_text(validator.replace(old_validator, new_validator), encoding='utf-8')
          PY

          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 tools/assurance/test_d3d_completion_provenance.py
          git diff --check
          git diff --exit-code -- .github/workflows/d3d-run43-provenance-reanchor-one-shot.yml

      - name: Commit minimal normalized provenance delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SupportingBasesOfficial'
          git config user.email 'suportingbases@gmail.com'
          git add \
            implementation/d3-identity-security/state-manifest.json \
            tools/assurance/validate_d3_identity_security_state.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'assurance(D3-D): normalize repaired provenance delta'
          git push origin HEAD:evidence/d3-d-workload-identity-c2
