name: JLMIRROR D3-D One-shot Run 43 Provenance Normalizer

on:
  push:
    branches:
      - evidence/d3-d-workload-identity-c2
    paths:
      - .github/workflows/d3d-run43-provenance-reanchor-one-shot.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/d3-d-workload-identity-c2
          fetch-depth: 0

      - name: Restore baseline formatting and apply exact run 43 provenance
        shell: bash
        run: |
          set -euo pipefail
          base='44cd732320b98e2d28c6027f9abd17488a6cb25a'
          manifest='implementation/d3-identity-security/state-manifest.json'
          validator='tools/assurance/validate_d3_identity_security_state.py'

          git checkout "$base" -- "$manifest" "$validator"

          test "$(grep -c 'c8ac05c4bcea367949489c94dfe876605e2f4261' "$manifest")" -eq 2
          test "$(grep -c '33342690140' "$manifest")" -eq 2
          test "$(grep -c '"'"'workflow_run_number'"'": 38' "$manifest")" -eq 2
          sed -i 's/c8ac05c4bcea367949489c94dfe876605e2f4261/44cd732320b98e2d28c6027f9abd17488a6cb25a/g' "$manifest"
          sed -i 's/33342690140/33344277084/g' "$manifest"
          sed -i 's/"workflow_run_number": 38/"workflow_run_number": 43/g' "$manifest"

          test "$(grep -c 'c8ac05c4bcea367949489c94dfe876605e2f4261' "$validator")" -eq 1
          test "$(grep -c '33342690140' "$validator")" -eq 1
          test "$(grep -c '"'"'workflow_run_number'"'": 38' "$validator")" -eq 1
          sed -i 's/c8ac05c4bcea367949489c94dfe876605e2f4261/44cd732320b98e2d28c6027f9abd17488a6cb25a/g' "$validator"
          sed -i 's/33342690140/33344277084/g' "$validator"
          sed -i 's/"workflow_run_number": 38/"workflow_run_number": 43/g' "$validator"

          python3 tools/assurance/validate_d3_identity_security_state.py .
          python3 tools/assurance/test_d3d_completion_provenance.py
          git diff --check

      - name: Commit minimal normalized provenance delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SupportingBasesOfficial'
          git config user.email 'suportingbases@gmail.com'
          git add \
            implementation/d3-identity-security/state-manifest.json \
            tools/assurance/validate_d3_identity_security_state.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'assurance(D3-D): normalize repaired provenance delta'
          git push origin HEAD:evidence/d3-d-workload-identity-c2
