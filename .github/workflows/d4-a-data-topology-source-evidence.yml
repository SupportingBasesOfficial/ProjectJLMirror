name: JLMIRROR D4-A Data Topology Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/**'
      - 'tools/assurance/d4a_data_topology/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'tools/assurance/validate_d4a_evidence_plan.py'
      - 'tools/assurance/test_validate_d4a_evidence_plan.py'
      - 'docs/10-event-contracts/**'
      - 'docs/16-implementation-readiness/25-d4-a-data-topology-source-evidence.md'
      - 'docs/16-implementation-readiness/26-d4-a-data-topology-ledger-promotion.md'
      - '.github/workflows/d4-a-data-topology-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  data-topology-source:
    name: D4-A data topology source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Compile data-topology source tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4a_data_topology/policy_boundary.py \
            tools/assurance/d4a_data_topology/test_data_topology.py \
            tools/assurance/d4a_data_topology/validate_source_evidence.py \
            tools/assurance/d4a_data_topology/emit_source_provenance.py

      - name: Falsify regulated-payload and topology escapes
        shell: bash
        working-directory: tools/assurance/d4a_data_topology
        run: python3 test_data_topology.py

      - name: Validate bounded data-topology source manifest
        shell: bash
        run: python3 tools/assurance/d4a_data_topology/validate_source_evidence.py

      - name: Preserve D4 scoped ledger boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4a_evidence_plan.py .
          (cd tools/assurance && python3 test_validate_d4a_evidence_plan.py)

      - name: Re-run Phase 10 contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tools/contracts/tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Assert current source run cannot add ledger credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/data-topology/source-evidence-manifest.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-a-evidence-plan.json').read_text())
          d4a = next(t for t in state['tracks'] if t['track_id'] == 'D4-A')
          prior = {
              'broker_neutral_anti_corruption_stub_swap',
              'exactly_once_guardrail_consumer_inbox_enforcement',
          }
          source_ids = {
              'regulated_payload_erasure_granularity',
              'physical_naming_routing_and_cell_topology_adapter_mapping',
          }
          promoted = set(plan['credited_evidence'])
          assert source['current_run_auto_credit'] is False
          assert source['ledger_credit'] == []
          assert set(source['prior_promoted_ledger_credit']) == prior
          assert set(source['evidence_ids']) == source_ids
          assert prior.issubset(promoted)
          assert source_ids.issubset(promoted)
          assert set(d4a['evidence_completed']) == promoted
          assert set(d4a['evidence_completed']).isdisjoint(d4a['evidence_remaining'])
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print(f'd4a_data_topology_nonpromotion=PASS source_credit=0 global_promoted_credit={len(promoted)} kafka=not_selected authorities=not_granted')
          PY

      - name: Resolve exact workflow job identity and emit immutable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs = json.load(open('runtime-evidence/jobs.json', encoding='utf-8'))['jobs']
          matches = [job for job in jobs if job['name'] == 'D4-A data topology source evidence']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one current evidence job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4a_data_topology/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-A data topology source evidence" \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist resolved source-run provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d4-a-data-topology-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/resolved-source-run-provenance.json
          if-no-files-found: error
          retention-days: 90
