name: JLMIRROR D4-A Kafka Candidate Evidence Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d4a-plan:
    name: D4-A evidence ledger boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-A assurance tooling
        shell: bash
        run: python3 -m py_compile tools/assurance/validate_d4a_evidence_plan.py tools/assurance/test_validate_d4a_evidence_plan.py

      - name: Falsify D4-A evidence-ledger weakening
        shell: bash
        working-directory: tools/assurance
        run: python3 test_validate_d4a_evidence_plan.py

      - name: Validate D4-A evidence plan and chained promotion provenance
        shell: bash
        run: python3 tools/assurance/validate_d4a_evidence_plan.py .

      - name: Preserve D4 scoped boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Determine whether this PR changes promotion authority
        id: promotion_delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- \
            implementation/d4-eventing-async/d4-a-evidence-plan.json \
            implementation/d4-eventing-async/state-manifest.json \
            implementation/d4-eventing-async/ledger-promotions/d4-a-capacity-ordering-promotion-v1.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Admit promoted source run from live external evidence
        if: steps.promotion_delta.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/d4a_promotion.env
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-a-capacity-ordering-promotion-v1.json').read_text())
          w = p['source_workflow']
          for key, value in {'RUN_ID':w['run_id'],'JOB_ID':w['job_id'],'ARTIFACT_ID':w['artifact_id'],'SOURCE_PR':p['source_pr']}.items():
              print(f'{key}={value}')
          PY
          source /tmp/d4a_promotion.env
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -o /tmp/run.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" -o /tmp/job.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" -o /tmp/artifact.json
          curl --fail --silent --show-error --location "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/source-artifact.zip
          rm -rf /tmp/source-artifact && mkdir -p /tmp/source-artifact
          unzip -q /tmp/source-artifact.zip -d /tmp/source-artifact
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews?per_page=100" -o /tmp/reviews.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$SOURCE_PR/comments?per_page=100" -o /tmp/comments.json
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-a-capacity-ordering-promotion-v1.json').read_text())
          w, g = p['source_workflow'], p['review_gate']
          run = json.load(open('/tmp/run.json'))
          job = json.load(open('/tmp/job.json'))
          artifact = json.load(open('/tmp/artifact.json'))
          reviews = json.load(open('/tmp/reviews.json'))
          comments = json.load(open('/tmp/comments.json'))
          root = Path('/tmp/source-artifact')
          files = {x.name for x in root.iterdir() if x.is_file()}
          assert files == {'resolved-source-run-provenance.json','benchmark-results.json'}, files
          provenance = json.loads((root/'resolved-source-run-provenance.json').read_text())
          benchmark_bytes = (root/'benchmark-results.json').read_bytes()
          benchmark = json.loads(benchmark_bytes)
          artifact_run = artifact.get('workflow_run') or {}
          assert run['id'] == w['run_id'] and run['run_attempt'] == w['run_attempt']
          assert run['head_sha'] == p['source_reviewed_head']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert job['id'] == w['job_id'] and job['run_id'] == w['run_id'] and job['run_attempt'] == w['run_attempt']
          assert job['name'] == w['job_name'] and job['status'] == 'completed' and job['conclusion'] == 'success'
          assert artifact['id'] == w['artifact_id'] and artifact['name'] == w['artifact_name'] and artifact['digest'] == w['artifact_digest']
          assert artifact['expired'] is False
          assert artifact_run['id'] == w['run_id'] and artifact_run['head_sha'] == p['source_reviewed_head']
          assert provenance['schema'] == 'd4a-capacity-ordering-source-run-provenance-v1'
          assert provenance['probe'] == 'd4a_live_kafka_capacity_ordering'
          assert provenance['repository_sha'] == p['source_reviewed_head']
          assert provenance['workflow_run_id'] == w['run_id'] and provenance['workflow_run_attempt'] == w['run_attempt']
          assert provenance['job_id'] == w['job_id'] and provenance['job_name'] == w['job_name']
          assert provenance['source_manifest_sha256'] == p['source_manifest_sha256']
          assert provenance['benchmark_results_sha256'] == sha256(benchmark_bytes).hexdigest()
          assert set(provenance['evidence_ids']) == {i['evidence_id'] for i in p['credited_evidence']}
          assert provenance['evidence_kinds'] == {i['evidence_id']:i['evidence_kind'] for i in p['credited_evidence']}
          assert provenance['candidate'] == 'kafka' and provenance['candidate_version'] == '4.3.1'
          assert provenance['current_run_auto_credit'] is False and provenance['ledger_credit'] == []
          assert provenance['kafka_selection_state'] == 'not_selected'
          assert provenance['numeric_authority'] == 'test_values_only_not_production'
          assert benchmark['numeric_authority'] == 'test_values_only_not_production'
          assert [t['name'] for t in benchmark['tiers']] == ['Baseline','Growth','Stress']
          assert all(t['device_cardinality_exercised'] is True for t in benchmark['tiers'])
          assert all(t['device_cardinality_observed_by_tenant'] == t['device_cardinality_expected_by_tenant'] for t in benchmark['tiers'])
          assert benchmark['degradation_probe']['degradation_boundary_observed'] is True
          assert len(benchmark['ordering_profiles']) == 6
          assert benchmark['tenant_cohort_fallback']['exercised'] is True
          by_node = {r.get('node_id'):r for r in reviews}
          for key in ('independent_adversarial_review_node_id','fresh_codex_exact_head_review_node_id'):
              assert g[key] in by_node, f'missing pinned review {key}'
              assert by_node[g[key]].get('commit_id') == p['source_reviewed_head']
          assert any(c.get('id') == g['final_gate_comment_id'] for c in comments)
          print('d4a_promotion_live_admission=PASS run=exact job=exact artifact=live_and_exact artifact_content=exact benchmark=exact reviews=exact final_gate=present')
          PY

      - name: Validate steady-state durable provenance policy
        if: steps.promotion_delta.outputs.changed == 'false'
        shell: bash
        run: |
          echo 'd4a_promotion_live_admission=SKIP steady_state=true reason=artifact_retention_is_not_permanent durable_chain=validated_by_static_digest_gate'

      - name: Assert six-of-seven partial credit does not escalate authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('implementation/d4-eventing-async/d4-a-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          d4a = next(t for t in state['tracks'] if t['track_id'] == 'D4-A')
          expected = {
              'capacity_envelope_baseline_growth_stress',
              'broker_neutral_anti_corruption_stub_swap',
              'regulated_payload_erasure_granularity',
              'exactly_once_guardrail_consumer_inbox_enforcement',
              'ordering_scope_partition_mapping_ceiling_tenant_cohort_fallback_and_key_level_concurrency',
              'physical_naming_routing_and_cell_topology_adapter_mapping',
          }
          remaining = {'broker_outbox_dispatch_priority_preserving_backlog_drain_recovery_benchmark'}
          assert plan['ledger_credit_state'] == 'six_of_seven'
          assert set(plan['credited_evidence']) == expected
          assert plan['selection_state'] == 'not_selected' and plan['acceptance_state'] == 'not_eligible'
          assert set(d4a['evidence_completed']) == expected and set(d4a['evidence_remaining']) == remaining
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4a_ledger_boundary=PASS credited=6 remaining=1 kafka=not_selected acceptance=not_eligible authorities=not_granted')
          PY
