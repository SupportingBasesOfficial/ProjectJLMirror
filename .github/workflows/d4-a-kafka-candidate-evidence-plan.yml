name: JLMIRROR D4-A Kafka Candidate Evidence Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d4a-plan:
    name: D4-A evidence ledger boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Compile D4-A assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4a_evidence_plan.py \
            tools/assurance/test_validate_d4a_evidence_plan.py

      - name: Falsify D4-A evidence-ledger weakening
        shell: bash
        working-directory: tools/assurance
        run: python3 test_validate_d4a_evidence_plan.py

      - name: Validate D4-A evidence plan and chained promotion provenance
        shell: bash
        run: python3 tools/assurance/validate_d4a_evidence_plan.py .

      - name: Preserve D4 scoped boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Verify promoted source run artifact content and review identities match pinned provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/d4a_promotion.env
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-a-data-topology-promotion-v1.json').read_text())
          w = p['source_workflow']
          for key, value in {
              'RUN_ID': w['run_id'],
              'JOB_ID': w['job_id'],
              'ARTIFACT_ID': w['artifact_id'],
              'SOURCE_PR': p['source_pr'],
          }.items():
              print(f'{key}={value}')
          PY
          source /tmp/d4a_promotion.env
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -o /tmp/run.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" -o /tmp/job.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" -o /tmp/artifact.json
          curl --fail --silent --show-error --location "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/source-artifact.zip
          rm -rf /tmp/source-artifact
          mkdir -p /tmp/source-artifact
          test "$(unzip -Z1 /tmp/source-artifact.zip | wc -l)" -eq 1
          test "$(unzip -Z1 /tmp/source-artifact.zip)" = "resolved-source-run-provenance.json"
          unzip -q /tmp/source-artifact.zip -d /tmp/source-artifact
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews?per_page=100" -o /tmp/reviews.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$SOURCE_PR/comments?per_page=100" -o /tmp/comments.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-a-data-topology-promotion-v1.json').read_text())
          w = p['source_workflow']
          g = p['review_gate']
          run = json.load(open('/tmp/run.json'))
          job = json.load(open('/tmp/job.json'))
          artifact = json.load(open('/tmp/artifact.json'))
          provenance = json.load(open('/tmp/source-artifact/resolved-source-run-provenance.json'))
          reviews = json.load(open('/tmp/reviews.json'))
          comments = json.load(open('/tmp/comments.json'))
          artifact_run = artifact.get('workflow_run') or {}
          assert run['id'] == w['run_id']
          assert run['run_attempt'] == w['run_attempt']
          assert run['head_sha'] == p['source_reviewed_head']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert job['id'] == w['job_id']
          assert job['run_id'] == w['run_id']
          assert job['run_attempt'] == w['run_attempt']
          assert job['name'] == w['job_name']
          assert job['status'] == 'completed' and job['conclusion'] == 'success'
          assert artifact['id'] == w['artifact_id']
          assert artifact['name'] == w['artifact_name']
          assert artifact['digest'] == w['artifact_digest']
          assert artifact['expired'] is False
          assert artifact_run['id'] == w['run_id']
          assert artifact_run['head_sha'] == p['source_reviewed_head']
          assert provenance['schema'] == 'd4a-source-run-provenance-v1'
          assert provenance['repository_sha'] == p['source_reviewed_head']
          assert provenance['workflow_run_id'] == w['run_id']
          assert provenance['workflow_run_attempt'] == w['run_attempt']
          assert provenance['job_id'] == w['job_id']
          assert provenance['job_name'] == w['job_name']
          assert provenance['source_manifest_sha256'] == p['source_manifest_sha256']
          assert set(provenance['evidence_ids']) == {item['evidence_id'] for item in p['credited_evidence']}
          assert provenance['evidence_kinds'] == {item['evidence_id']: item['evidence_kind'] for item in p['credited_evidence']}
          assert provenance['current_run_auto_credit'] is False
          assert provenance['ledger_credit'] == []
          assert provenance['promotion_rule'] == 'source_run_review_then_separate_ledger_promotion'
          by_node = {review.get('node_id'): review for review in reviews}
          for node_key in ('initial_codex_review_node_id', 'independent_adversarial_review_node_id', 'fresh_codex_exact_head_review_node_id'):
              assert g[node_key] in by_node, f'missing pinned review: {node_key}'
          fresh = by_node[g['fresh_codex_exact_head_review_node_id']]
          independent = by_node[g['independent_adversarial_review_node_id']]
          assert fresh.get('commit_id') == p['source_reviewed_head']
          assert independent.get('commit_id') == p['source_reviewed_head']
          assert any(comment.get('id') == g['final_gate_comment_id'] for comment in comments)
          print('d4a_promotion_external_provenance=PASS source_run=success artifact_metadata=exact artifact_content=exact source_manifest_link=exact review_nodes=exact exact_head_reviews=verified final_gate_comment=present')
          PY

      - name: Assert four-of-seven partial credit does not escalate authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('implementation/d4-eventing-async/d4-a-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          d4a = next(t for t in state['tracks'] if t['track_id'] == 'D4-A')
          expected = {
              'broker_neutral_anti_corruption_stub_swap',
              'regulated_payload_erasure_granularity',
              'exactly_once_guardrail_consumer_inbox_enforcement',
              'physical_naming_routing_and_cell_topology_adapter_mapping',
          }
          remaining = {
              'capacity_envelope_baseline_growth_stress',
              'ordering_scope_partition_mapping_ceiling_tenant_cohort_fallback_and_key_level_concurrency',
              'broker_outbox_dispatch_priority_preserving_backlog_drain_recovery_benchmark',
          }
          assert plan['source_evidence_state'] == 'reviewed_source_runs_available'
          assert plan['ledger_credit_state'] == 'four_of_seven'
          assert set(plan['credited_evidence']) == expected
          assert plan['selection_state'] == 'not_selected'
          assert plan['current_run_auto_credit'] is False
          assert set(d4a['evidence_completed']) == expected
          assert set(d4a['evidence_remaining']) == remaining
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4a_ledger_boundary=PASS credited=4 remaining=3 kafka=not_selected authorities=not_granted')
          PY
