name: JLMIRROR D4-A Recovery Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/**'
      - 'tools/assurance/d4a_recovery/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'tools/assurance/validate_d4a_evidence_plan.py'
      - 'tools/assurance/test_validate_d4a_evidence_plan.py'
      - 'docs/10-event-contracts/OPEN-EVT-001-kafka-decision-record.md'
      - 'docs/10-event-contracts/publication-outbox-and-producer-authority.md'
      - 'docs/10-event-contracts/recovery-retention-and-reconciliation.md'
      - 'docs/16-implementation-readiness/29-d4-a-recovery-source-evidence.md'
      - '.github/workflows/d4-a-recovery-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recovery-source:
    name: D4-A recovery source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KAFKA_IMAGE: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
      KAFKA_INDEX_DIGEST: sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
      KAFKA_AMD64_DIGEST: sha256:ccd1314e47ec76909e01f86308b4dcf2064f19f7c89759234322314b0e319e26
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile validate and falsify recovery source package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4a_recovery/run_live_kafka_recovery.py \
            tools/assurance/d4a_recovery/validate_source_evidence.py \
            tools/assurance/d4a_recovery/test_validate_source_evidence.py \
            tools/assurance/d4a_recovery/emit_source_provenance.py
          python3 tools/assurance/d4a_recovery/validate_source_evidence.py
          (cd tools/assurance/d4a_recovery && python3 test_validate_source_evidence.py)

      - name: Preserve D4 seven-of-seven evidence-complete boundary before source re-run
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4a_evidence_plan.py .
          (cd tools/assurance && python3 test_validate_d4a_evidence_plan.py)

      - name: Pull and verify immutable Kafka candidate platform pin
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$KAFKA_IMAGE"
          python3 - <<'PY'
          import json, os, subprocess
          image = os.environ['KAFKA_IMAGE']
          expected_index = os.environ['KAFKA_INDEX_DIGEST']
          expected_amd64 = os.environ['KAFKA_AMD64_DIGEST']
          raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', image, '--raw'], text=True)
          index = json.loads(raw)
          matches = [m for m in index.get('manifests', []) if m.get('platform', {}).get('os') == 'linux' and m.get('platform', {}).get('architecture') == 'amd64']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one linux/amd64 manifest, got {len(matches)}')
          actual_amd64 = matches[0]['digest']
          if actual_amd64 != expected_amd64:
              raise SystemExit(f'amd64 manifest digest mismatch: {actual_amd64} != {expected_amd64}')
          if '@' not in image or image.rsplit('@', 1)[1] != expected_index:
              raise SystemExit('image reference is not pinned to expected index digest')
          print(f'kafka_pin=PASS index={expected_index} linux_amd64={actual_amd64}')
          PY
          printf '%s\n' "$KAFKA_INDEX_DIGEST" > /tmp/kafka-index-digest.txt
          printf '%s\n' "$KAFKA_AMD64_DIGEST" > /tmp/kafka-amd64-digest.txt

      - name: Start real Kafka candidate broker
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name d4a-kafka -p 9092:9092 "$KAFKA_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec d4a-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "kafka_ready_attempt=$attempt"
              exit 0
            fi
            sleep 2
          done
          docker logs d4a-kafka
          exit 1

      - name: Run real outage outbox backlog drain and ambiguity recovery probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 tools/assurance/d4a_recovery/run_live_kafka_recovery.py \
            --output runtime-evidence/benchmark-results.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('runtime-evidence/benchmark-results.json').read_text())
          assert result['schema'] == 'd4a-recovery-benchmark-results-v1'
          assert result['numeric_authority'] == 'test_values_only_not_production'
          assert result['real_candidate_outage_exercised'] is True
          assert result['committed_outbox_backlog_survives_broker_outage'] is True
          assert result['outbox_rows_committed_while_broker_unavailable'] >= 12
          assert result['outbox_rows_after_database_reopen'] == result['outbox_rows_committed_while_broker_unavailable']
          assert result['outbox_rows_remaining_after_broker_restart'] == result['outbox_rows_committed_while_broker_unavailable']
          assert result['backlog_fully_drained'] is True
          assert result['backlog_drain_seconds'] > 0
          assert result['priority_preserving_anti_starvation'] is True
          assert result['protected_current_messages_exercised'] >= 3
          assert result['max_backlog_before_each_protected_delivery'] <= 3
          ambiguity = result['ack_ambiguity']
          assert ambiguity['publish_attempts'] == 2
          assert ambiguity['distinct_logical_message_ids'] == 1
          assert ambiguity['same_logical_identity_reused'] is True
          progress = result['broker_progress_non_authority']
          assert progress['broker_end_offset_before_business_effects'] > 0
          assert progress['business_effect_count_before_consumer_admission'] == 0
          assert progress['broker_progress_is_business_effect_truth'] is False
          effects = result['consumer_effect_safety']
          assert effects['business_effect_count_after_consumer_admission'] == effects['unique_logical_messages']
          assert effects['broker_records_observed'] == effects['unique_logical_messages'] + 1
          assert effects['duplicate_business_effects_suppressed'] == 1
          assert effects['inbox_identity_is_logical_message_id'] is True
          assert result['kafka_selection_state'] == 'not_selected'
          assert result['d4_transport_authority'] == 'not_selected_not_granted'
          assert result['production_authority'] == 'none'
          assert result['c3_numeric_topology_authority'] == 'not_selected'
          print('d4a_recovery_result_gate=PASS outage=real outbox=durable drain=priority_preserving ack_ambiguity=same_identity broker_progress=non_authority duplicate_effect=blocked numerics=test_only')
          PY

      - name: Re-run Phase 10 contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tools/contracts/tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Assert historical recovery source remains non-promoting while global ledger is seven-of-seven
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/recovery/source-evidence-manifest.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-a-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          d4a = next(t for t in state['tracks'] if t['track_id'] == 'D4-A')
          recovery = 'broker_outbox_dispatch_priority_preserving_backlog_drain_recovery_benchmark'
          promoted = set(plan['credited_evidence'])
          assert source['current_run_auto_credit'] is False and source['ledger_credit'] == []
          assert recovery in promoted and len(promoted) == 7
          assert set(source['prior_promoted_ledger_credit']) == promoted - {recovery}
          assert set(d4a['evidence_completed']) == promoted and d4a['evidence_remaining'] == []
          assert d4a['state'] == 'evidence_complete_selection_pending'
          assert plan['ledger_credit_state'] == 'seven_of_seven'
          assert plan['selection_state'] == 'not_selected'
          assert plan['acceptance_state'] == 'evidence_complete_separate_acceptance_required'
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4a_recovery_source_immutability=PASS source_credit=0 historical_prior=6 global_credit=7 remaining=0 kafka=not_selected acceptance=separate_required authorities=not_granted')
          PY

      - name: Resolve exact workflow job identity and emit immutable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs = json.load(open('runtime-evidence/jobs.json', encoding='utf-8'))['jobs']
          matches = [job for job in jobs if job['name'] == 'D4-A recovery source evidence']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one recovery evidence job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4a_recovery/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-A recovery source evidence" \
            --kafka-image-index-digest "$(cat /tmp/kafka-index-digest.txt)" \
            --kafka-linux-amd64-manifest-digest "$(cat /tmp/kafka-amd64-digest.txt)" \
            --benchmark-results runtime-evidence/benchmark-results.json \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist source-run provenance and recovery benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d4-a-recovery-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-evidence/resolved-source-run-provenance.json
            runtime-evidence/benchmark-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop Kafka candidate broker
        if: always()
        shell: bash
        run: docker rm -f d4a-kafka >/dev/null 2>&1 || true
