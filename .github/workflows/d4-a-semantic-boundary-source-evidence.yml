name: JLMIRROR D4-A Semantic Boundary Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/**'
      - 'src/**'
      - 'tools/assurance/d4a_semantic_boundary/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'tools/assurance/validate_d4a_evidence_plan.py'
      - 'tools/assurance/test_validate_d4a_evidence_plan.py'
      - 'docs/10-event-contracts/**'
      - 'docs/16-implementation-readiness/23-d4-a-semantic-boundary-source-evidence.md'
      - 'docs/16-implementation-readiness/24-d4-a-semantic-boundary-ledger-promotion.md'
      - '.github/workflows/d4-a-semantic-boundary-source-evidence.yml'
      - '.github/workflows/d4-a-kafka-candidate-evidence-plan.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  semantic-boundary-source:
    name: D4-A semantic boundary source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Compile source-evidence tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4a_semantic_boundary/effect_protection.py \
            tools/assurance/d4a_semantic_boundary/broker_boundary.py \
            tools/assurance/d4a_semantic_boundary/consumer_registration_gate.py \
            tools/assurance/d4a_semantic_boundary/test_semantic_boundary.py \
            tools/assurance/d4a_semantic_boundary/validate_repository_boundary.py \
            tools/assurance/d4a_semantic_boundary/validate_structural_boundary_guards.py \
            tools/assurance/d4a_semantic_boundary/validate_controlflow_authority_and_bracket_calls_v4.py \
            tools/assurance/d4a_semantic_boundary/validate_controlflow_authority_and_bracket_calls_v4_entry.py \
            tools/assurance/d4a_semantic_boundary/validate_residual_escape_closure_v5.py \
            tools/assurance/d4a_semantic_boundary/validate_source_evidence.py \
            tools/assurance/d4a_semantic_boundary/emit_source_provenance.py

      - name: Prove lexical native allowlist and verify-before-ack dominance
        shell: bash
        working-directory: tools/assurance/d4a_semantic_boundary
        run: python3 validate_structural_boundary_guards.py

      - name: Discover and validate complete repository broker/consumer boundary
        shell: bash
        working-directory: tools/assurance/d4a_semantic_boundary
        run: python3 validate_repository_boundary.py

      - name: Enforce residual escape closure over patched v4 authority gate
        shell: bash
        working-directory: tools/assurance/d4a_semantic_boundary
        run: python3 validate_residual_escape_closure_v5.py

      - name: Run governed consumer-registration CI gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/d4a_semantic_boundary/consumer_registration_gate.py \
            --implementation-root implementation

      - name: Run transport-swap durable-effect and registration negative controls
        shell: bash
        working-directory: tools/assurance/d4a_semantic_boundary
        run: python3 test_semantic_boundary.py

      - name: Validate bounded source-evidence manifest
        shell: bash
        run: python3 tools/assurance/d4a_semantic_boundary/validate_source_evidence.py

      - name: Preserve D4 scoped ledger boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4a_evidence_plan.py .
          (cd tools/assurance && python3 test_validate_d4a_evidence_plan.py)

      - name: Re-run Phase 10 contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tools/contracts/tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Assert current source run cannot add ledger credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/semantic-boundary/source-evidence-manifest.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-a-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          d4a = next(t for t in state['tracks'] if t['track_id'] == 'D4-A')
          expected_prior_credit = {
              'broker_neutral_anti_corruption_stub_swap',
              'exactly_once_guardrail_consumer_inbox_enforcement',
          }
          assert source['current_run_auto_credit'] is False
          assert source['ledger_credit'] == []
          assert source['live_kafka_broker_claimed'] is False
          assert source['source_run_provenance']['mode'] == 'runtime_resolved_artifact_required'
          assert plan['current_run_auto_credit'] is False
          assert set(plan['credited_evidence']) == expected_prior_credit
          assert set(d4a['evidence_completed']) == expected_prior_credit
          assert len(d4a['evidence_remaining']) == 5
          assert state['d4_transport_authority'] == 'not_selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4a_source_nonpromotion=PASS source_credit=0 prior_promoted_credit=2 kafka=not_selected authorities=not_granted')
          PY

      - name: Resolve exact workflow job identity and emit immutable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs = json.load(open('runtime-evidence/jobs.json', encoding='utf-8'))['jobs']
          matches = [job for job in jobs if job['name'] == 'D4-A semantic boundary source evidence']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one current evidence job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4a_semantic_boundary/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-A semantic boundary source evidence" \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist resolved source-run provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d4-a-semantic-boundary-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/resolved-source-run-provenance.json
          if-no-files-found: error
          retention-days: 90
