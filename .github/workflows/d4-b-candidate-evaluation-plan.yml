name: JLMIRROR D4-B Candidate Evaluation Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
      - 'implementation/d4-eventing-async/d4-b-selection-record.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/validate_d4b_candidate_evaluation_plan.py'
      - 'tools/assurance/test_validate_d4b_candidate_evaluation_plan.py'
      - 'tools/assurance/validate_d4b_selection.py'
      - 'tools/assurance/test_validate_d4b_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/10-event-contracts/phase-10-open-decisions.md'
      - 'docs/16-implementation-readiness/34-d4-b-candidate-evaluation-plan.md'
      - 'docs/16-implementation-readiness/38-d4-b-bounded-c2-profile-selection.md'
      - '.github/workflows/d4-b-candidate-evaluation-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4b-candidate-evaluation-plan:
    name: D4-B candidate evaluation planning boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile evaluation and selection assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4b_candidate_evaluation_plan.py \
            tools/assurance/test_validate_d4b_candidate_evaluation_plan.py \
            tools/assurance/validate_d4b_selection.py \
            tools/assurance/test_validate_d4b_selection.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify D4-B evaluation weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4b_candidate_evaluation_plan.py

      - name: Validate historical evaluation plan and current selection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4b_candidate_evaluation_plan.py .
          python3 tools/assurance/test_validate_d4b_selection.py
          python3 tools/assurance/validate_d4b_selection.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract tooling
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert historical plan and current selection remain separated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          ledger = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          expected = {
              'serialization': {
                  'surface_policy': 'explicit_surface_bound_profiles',
                  'internal_broker': 'protobuf_profile',
                  'outbound_webhook': 'bounded_json_plus_json_schema_profile',
              },
              'schema_catalog': 'hybrid_reviewed_git_plus_registry_catalog',
              'contract_version': 'positive_integer_family_revision',
          }
          assert plan['mode'] == 'candidate_evaluation_only'
          assert plan['selection_state'] == 'not_selected' and plan['selection_authority'] == 'not_granted'
          assert ledger['selection_state'] == 'selected' and ledger['candidate'] == expected
          assert ledger['current_run_auto_credit'] is False
          assert tracks['D4-B']['candidate'] == expected and tracks['D4-B']['candidate_status'] == 'selected_c2_profile'
          assert tracks['D4-B']['state'] == 'selected_candidate'
          assert len(tracks['D4-B']['evidence_completed']) == 5 and tracks['D4-B']['evidence_remaining'] == []
          assert tracks['D4-A']['candidate'] == 'kafka' and len(tracks['D4-A']['evidence_completed']) == 7
          assert tracks['D4-C']['candidate'] is None and tracks['D4-C']['evidence_completed'] == []
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['evidence_completed'] == []
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 12
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4b_candidate_evaluation_boundary=PASS historical_plan=not_selected current_selection=selected_c2_profile evidence=5_of_5 d4a=kafka_7_of_7 d4wide=12/26 d4c_d=open d4=scoped authorities=not_granted')
          PY
