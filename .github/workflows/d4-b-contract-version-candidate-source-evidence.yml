name: JLMIRROR D4-B Contract Version Candidate Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json'
      - 'implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
      - 'implementation/d4-eventing-async/d4-b-selection-record.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4b_contract_version/**'
      - 'tools/assurance/validate_d4b_selection.py'
      - 'tools/assurance/test_validate_d4b_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/35-d4-b-contract-version-candidate-source-evidence.md'
      - 'docs/16-implementation-readiness/38-d4-b-bounded-c2-profile-selection.md'
      - '.github/workflows/d4-b-contract-version-candidate-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4b-contract-version-source:
    name: D4-B contract-version candidate source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRESELECTION_MAIN: 1104997c5bb97aae59373077a9e2f8d7570968b4
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$PRESELECTION_MAIN^{commit}"

      - name: Compile source and selection assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4b_contract_version/evaluate_candidates.py \
            tools/assurance/d4b_contract_version/validate_source_evidence.py \
            tools/assurance/d4b_contract_version/test_source_evidence.py \
            tools/assurance/validate_d4b_selection.py \
            tools/assurance/test_validate_d4b_selection.py

      - name: Execute candidate behavior evidence
        shell: bash
        run: python3 tools/assurance/d4b_contract_version/evaluate_candidates.py

      - name: Falsify historical candidate source-evidence weakening with HEAD tooling
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/tools/assurance/d4b_contract_version" "$root/implementation/d4-eventing-async/source-evidence"
          cp tools/assurance/d4b_contract_version/evaluate_candidates.py "$root/tools/assurance/d4b_contract_version/"
          cp tools/assurance/d4b_contract_version/validate_source_evidence.py "$root/tools/assurance/d4b_contract_version/"
          cp tools/assurance/d4b_contract_version/test_source_evidence.py "$root/tools/assurance/d4b_contract_version/"
          cp implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json "$root/implementation/d4-eventing-async/source-evidence/"
          cp implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json "$root/implementation/d4-eventing-async/"
          git show "$PRESELECTION_MAIN:implementation/d4-eventing-async/d4-b-evidence-plan.json" > "$root/implementation/d4-eventing-async/d4-b-evidence-plan.json"
          git show "$PRESELECTION_MAIN:implementation/d4-eventing-async/state-manifest.json" > "$root/implementation/d4-eventing-async/state-manifest.json"
          (cd "$root" && python3 tools/assurance/d4b_contract_version/test_source_evidence.py)
          rm -rf "$root"

      - name: Validate historical source manifest against pre-selection state
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/implementation/d4-eventing-async/source-evidence"
          cp implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json "$root/implementation/d4-eventing-async/source-evidence/"
          cp implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json "$root/implementation/d4-eventing-async/"
          git show "$PRESELECTION_MAIN:implementation/d4-eventing-async/d4-b-evidence-plan.json" > "$root/implementation/d4-eventing-async/d4-b-evidence-plan.json"
          git show "$PRESELECTION_MAIN:implementation/d4-eventing-async/state-manifest.json" > "$root/implementation/d4-eventing-async/state-manifest.json"
          python3 tools/assurance/d4b_contract_version/validate_source_evidence.py "$root"
          rm -rf "$root"

      - name: Validate current D4-B selected profile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4b_selection.py
          python3 tools/assurance/validate_d4b_selection.py .

      - name: Preserve global D4 state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contracts
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
