name: JLMIRROR D4-B Bounded C2 Profile Selection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-b-selection-record.json'
      - 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-catalog-tooling-candidate-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json'
      - 'implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json'
      - 'tools/assurance/validate_d4b_selection.py'
      - 'tools/assurance/test_validate_d4b_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/38-d4-b-bounded-c2-profile-selection.md'
      - '.github/workflows/d4-b-profile-selection.yml'
      - '.github/workflows/d4-b-wire-schema-candidate-source-evidence.yml'
      - '.github/workflows/d4-b-catalog-tooling-candidate-source-evidence.yml'
      - '.github/workflows/d4-b-contract-version-candidate-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4b-profile-selection:
    name: D4-B bounded C2 profile selection
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRESELECTION_MAIN: 1104997c5bb97aae59373077a9e2f8d7570968b4
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit and immutable evidence base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$PRESELECTION_MAIN^{commit}"
          git diff --exit-code "$PRESELECTION_MAIN" -- \
            implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json \
            implementation/d4-eventing-async/source-evidence/d4-b-catalog-tooling-candidate-source.json \
            implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json \
            implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json

      - name: Compile selection assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4b_selection.py \
            tools/assurance/test_validate_d4b_selection.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify selection weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4b_selection.py

      - name: Validate selected D4-B profile
        shell: bash
        run: python3 tools/assurance/validate_d4b_selection.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contracts
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert no authority escalation and exact current evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(Path('implementation/d4-eventing-async/d4-b-selection-record.json').read_text())
          ledger = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          d4c_credit = 'ack_after_durable_responsibility_and_lease_ambiguity'
          assert selection['selection_state'] == 'selected'
          assert ledger['selection_state'] == 'selected'
          assert len(ledger['credited_evidence']) == 5 and ledger['remaining_evidence'] == []
          assert len(tracks['D4-B']['evidence_completed']) == 5 and tracks['D4-B']['evidence_remaining'] == []
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          d4c = tracks['D4-C']
          assert d4c['candidate'] is None and d4c['candidate_status'] == 'not_selected'
          assert d4c['state'] == 'candidate_selection_open'
          assert d4c['evidence_completed'] == [d4c_credit]
          assert len(d4c['evidence_remaining']) == 8 and d4c_credit not in d4c['evidence_remaining']
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['candidate_status'] == 'not_selected'
          assert tracks['D4-D']['evidence_completed'] == []
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 13
          print('d4b_selection_boundary=PASS d4b=5/5 d4wide=13/26 d4c=1/9 d4d=0/5 d4=scoped product_wave4=not_granted production=none c3=not_selected')
          PY
