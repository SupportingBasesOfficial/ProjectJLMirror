name: JLMIRROR D4-B Bounded C2 Profile Selection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-b-selection-record.json'
      - 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-catalog-tooling-candidate-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json'
      - 'implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json'
      - 'tools/assurance/validate_d4b_selection.py'
      - 'tools/assurance/test_validate_d4b_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/38-d4-b-bounded-c2-profile-selection.md'
      - '.github/workflows/d4-b-profile-selection.yml'
      - '.github/workflows/d4-b-wire-schema-candidate-source-evidence.yml'
      - '.github/workflows/d4-b-catalog-tooling-candidate-source-evidence.yml'
      - '.github/workflows/d4-b-contract-version-candidate-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4b-profile-selection:
    name: D4-B bounded C2 profile selection
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRESELECTION_MAIN: 1104997c5bb97aae59373077a9e2f8d7570968b4
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit and immutable evidence base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$PRESELECTION_MAIN^{commit}"
          git diff --exit-code "$PRESELECTION_MAIN" -- implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json implementation/d4-eventing-async/source-evidence/d4-b-catalog-tooling-candidate-source.json implementation/d4-eventing-async/source-evidence/d4-b-contract-version-candidate-source.json implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json
      - name: Compile selection assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/validate_d4b_selection.py tools/assurance/test_validate_d4b_selection.py tools/assurance/validate_d4_eventing_async_state.py tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify selection weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4b_selection.py
      - name: Validate selected D4-B profile
        shell: bash
        run: python3 tools/assurance/validate_d4b_selection.py .
      - name: Preserve separately accepted D4 gate and terminal track state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contracts
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert accepted D4 gate without authority escalation and exact current evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          selection=json.loads(Path('implementation/d4-eventing-async/d4-b-selection-record.json').read_text()); ledger=json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text()); state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text()); tracks={t['track_id']:t for t in state['tracks']}
          d4c_credits=['ack_after_durable_responsibility_and_lease_ambiguity','quarantine_redrive_current_authority_and_dedup_preservation','bounded_message_batch_compression_and_parser_limits','scoped_content_equivalence_confidentiality_and_conflict_rejection','outbox_claim_dispatch_ack_ambiguity_and_recovery_continuity','producer_generation_nonresurrection_across_failover_restore','privileged_bounded_replay_with_original_identity_and_effect_safety','historical_reader_upcaster_semantic_and_equivalence_continuity','recovery_generation_rf_inventory_reconciliation_and_activation_gates']
          d4d_credits=['workload_identity_to_broker_credential_adapter_least_privilege','tenant_and_contract_scoped_producer_consumer_authorization','message_protection_key_authority_and_historical_verifier_continuity','secret_credential_payload_exclusion_and_erasure_boundary','trace_context_observability_only_validation_and_redaction']
          expected_c={'ack_visibility_lease_and_checkpoint':'durable_inbox_claim_then_broker_ack_profile','quarantine_and_redrive':'hybrid_platform_quarantine_store_plus_broker_dlq','bounded_message_payload_batch_and_compression':'layered_transport_and_application_bounds_profile','scoped_content_equivalence_authority':'hybrid_equivalence_authority_profile','outbox_claim_dispatch_and_ack_ambiguity':'compare_and_swap_lease_claim_profile','producer_source_generation':'authority_issued_epoch_generation','privileged_replay_and_event_history':'hybrid_history_archive_plus_replay_controller_profile','historical_reader_and_upcaster':'in_process_versioned_reader_upcaster_registry','recovery_generation_reconciliation_and_activation':'hybrid_generation_manifest_plus_multi_store_reconciler_profile'}
          assert selection['selection_state']=='selected' and ledger['selection_state']=='selected'
          assert len(ledger['credited_evidence'])==5 and ledger['remaining_evidence']==[]
          assert len(tracks['D4-B']['evidence_completed'])==5 and tracks['D4-B']['evidence_remaining']==[]
          assert state['gate_state']=='separately_accepted' and state['d4_transport_authority']=='selected_not_granted' and state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted' and state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          d4c=tracks['D4-C']; assert d4c['candidate']==expected_c and d4c['candidate_status']=='selected_c2_delivery_recovery_profile' and d4c['state']=='selected_candidate'
          assert d4c['evidence_completed']==d4c_credits and d4c['evidence_remaining']==[]
          d4d=tracks['D4-D']; assert d4d['candidate']=={'workload_identity_to_broker_credential_adapter': 'derived_short_lived_broker_native_credential_adapter', 'tenant_and_contract_scoped_producer_consumer_authorization': 'broker_acl_projection_adapter', 'message_protection_key_authority_and_historical_verifier_continuity': 'kms_backed_envelope_or_transport_protection_profile', 'secret_credential_payload_exclusion_and_erasure_boundary': 'reference_only_secret_authority_profile', 'trace_context_observability_only_validation_and_redaction': 'w3c_trace_context_bounded_profile'} and d4d['candidate_status']=='selected_c2_security_profile' and d4d['state']=='selected_candidate'
          assert d4d['evidence_completed']==d4d_credits and d4d['evidence_remaining']==[]
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          print('d4b_selection_boundary=PASS d4b=5/5 d4wide=26/26 d4c=9/9_selected d4d=5/5 d4=separately_accepted transport_authority=selected_not_granted product_wave4=not_granted production=none c3=not_selected')
          PY