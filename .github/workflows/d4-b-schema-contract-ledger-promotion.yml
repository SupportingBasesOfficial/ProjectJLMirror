name: JLMIRROR D4-B Schema Contract Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/**'
      - 'tools/assurance/validate_d4b_evidence_plan.py'
      - 'tools/assurance/test_validate_d4b_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'tools/assurance/d4b_schema_contract/**'
      - 'docs/10-event-contracts/**'
      - 'docs/16-implementation-readiness/32-d4-b-schema-contract-source-evidence.md'
      - 'docs/16-implementation-readiness/33-d4-b-schema-contract-ledger-promotion.md'
      - '.github/workflows/d4-b-schema-contract-source-evidence.yml'
      - '.github/workflows/d4-b-schema-contract-ledger-promotion.yml'
      - '.github/workflows/d4-eventing-async-entry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d4b-ledger-promotion:
    name: D4-B reviewed source ledger promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-B promotion and state tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4b_evidence_plan.py \
            tools/assurance/test_validate_d4b_evidence_plan.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py \
            tools/assurance/d4b_schema_contract/validate_source_evidence.py

      - name: Falsify D4-B ledger promotion weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4b_evidence_plan.py

      - name: Validate D4-B reviewed ledger promotion
        shell: bash
        run: python3 tools/assurance/validate_d4b_evidence_plan.py .

      - name: Preserve D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve immutable D4-B source package semantics
        shell: bash
        run: python3 tools/assurance/d4b_schema_contract/validate_source_evidence.py

      - name: Preserve accepted Phase 10 contract tooling
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Determine whether this PR changes D4-B evidence-promotion authority
        id: promotion_delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "d4b_promotion_delta=steady_state reason=no_pull_request_base"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          base_sha = os.environ['BASE_SHA']
          plan_path = 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
          promotion_path = 'implementation/d4-eventing-async/ledger-promotions/d4-b-schema-contract-promotion-v1.json'
          promotion_keys = (
              'ledger_credit_state',
              'credited_evidence',
              'remaining_evidence',
              'source_evidence_state',
          )

          def git_show(path: str) -> bytes | None:
              proc = subprocess.run(
                  ['git', 'show', f'{base_sha}:{path}'],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              return proc.stdout if proc.returncode == 0 else None

          base_plan_bytes = git_show(plan_path)
          if base_plan_bytes is None:
              raise SystemExit('base D4-B evidence plan is missing')
          base_plan = json.loads(base_plan_bytes)
          head_plan = json.loads(Path(plan_path).read_text(encoding='utf-8'))

          def project(plan: dict) -> dict:
              return {key: plan.get(key) for key in promotion_keys}

          base_promotion = git_show(promotion_path)
          head_promotion_path = Path(promotion_path)
          head_promotion = head_promotion_path.read_bytes() if head_promotion_path.exists() else None
          changed = project(base_plan) != project(head_plan) or base_promotion != head_promotion
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print(
              f"d4b_promotion_delta={'changed' if changed else 'steady_state'} "
              "projection=evidence_only promotion_record=bound selection_fields=excluded"
          )
          PY

      - name: Admit promoted D4-B source run from live external evidence
        if: steps.promotion_delta.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/d4b_promotion.env
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-b-schema-contract-promotion-v1.json').read_text())
          w = p['source_workflow']
          for key, value in {
              'RUN_ID': w['run_id'],
              'RUN_ATTEMPT': w['run_attempt'],
              'JOB_ID': w['job_id'],
              'ARTIFACT_ID': w['artifact_id'],
              'ARTIFACT_NAME': w['artifact_name'],
              'ARTIFACT_DIGEST': w['artifact_digest'],
              'SOURCE_HEAD': p['source_reviewed_head'],
          }.items():
              print(f'{key}={value}')
          PY
          source /tmp/d4b_promotion.env
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            -o /tmp/run.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" \
            -o /tmp/job.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            -o /tmp/artifact.json
          curl --fail --silent --show-error --location "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/source-artifact.zip
          rm -rf /tmp/source-artifact && mkdir -p /tmp/source-artifact
          unzip -q /tmp/source-artifact.zip -d /tmp/source-artifact
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-b-schema-contract-promotion-v1.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/schema-contract/source-evidence-manifest.json').read_text())
          w = p['source_workflow']
          run = json.load(open('/tmp/run.json'))
          job = json.load(open('/tmp/job.json'))
          artifact = json.load(open('/tmp/artifact.json'))
          artifact_run = artifact.get('workflow_run') or {}
          root = Path('/tmp/source-artifact')
          files = {item.name for item in root.iterdir() if item.is_file()}
          assert files == {'resolved-source-run-provenance.json'}, files
          provenance = json.loads((root / 'resolved-source-run-provenance.json').read_text())
          expected_evidence = set(plan['required_evidence'])
          assert len(expected_evidence) == 5
          assert run['id'] == w['run_id']
          assert run['run_attempt'] == w['run_attempt']
          assert run['head_sha'] == p['source_reviewed_head']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert job['id'] == w['job_id']
          assert job['run_id'] == w['run_id']
          assert job['run_attempt'] == w['run_attempt']
          assert job['name'] == w['job_name']
          assert job['status'] == 'completed' and job['conclusion'] == 'success'
          assert artifact['id'] == w['artifact_id']
          assert artifact['name'] == w['artifact_name']
          assert artifact['digest'] == w['artifact_digest']
          assert artifact['expired'] is False
          assert artifact_run['id'] == w['run_id']
          assert artifact_run['head_sha'] == p['source_reviewed_head']
          assert provenance['schema'] == 'd4b-schema-contract-source-run-provenance-v1'
          assert provenance['probe'] == 'd4b_deterministic_schema_contract_reference'
          assert provenance['repository_sha'] == p['source_reviewed_head']
          assert provenance['workflow_run_id'] == w['run_id']
          assert provenance['workflow_run_attempt'] == w['run_attempt']
          assert provenance['job_id'] == w['job_id']
          assert provenance['job_name'] == w['job_name']
          assert provenance['source_manifest_sha256'] == p['source_manifest']['sha256']
          assert set(provenance['evidence_ids']) == expected_evidence
          assert provenance['evidence_kinds'] == source['evidence_kinds']
          assert provenance['candidate'] is None and provenance['candidate_status'] == 'not_selected'
          assert provenance['current_run_auto_credit'] is False and provenance['ledger_credit'] == []
          assert provenance['serialization_selection_state'] == 'not_selected'
          assert provenance['schema_catalog_selection_state'] == 'not_selected'
          assert provenance['contract_version_syntax_selection_state'] == 'not_selected'
          assert provenance['d4_transport_authority'] == 'selected_not_granted'
          assert provenance['production_authority'] == 'none'
          assert provenance['c3_numeric_topology_authority'] == 'not_selected'
          assert provenance['promotion_rule'] == 'source_run_review_then_separate_ledger_promotion'
          print('d4b_promotion_live_admission=PASS source_run=success run_attempt=exact job=exact artifact=exact_digest artifact_payload=exact source_manifest=exact source_credit=0 selection=not_selected')
          PY

      - name: Validate steady-state durable D4-B promotion provenance
        if: steps.promotion_delta.outputs.changed == 'false'
        shell: bash
        run: |
          echo 'd4b_promotion_live_admission=SKIP promotion_unchanged=true artifact_retention_dependency=false durable_record_and_digests=validated'

      - name: Assert promotion does not select technology or escalate authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/schema-contract/source-evidence-manifest.json').read_text())
          d4b = next(t for t in state['tracks'] if t['track_id'] == 'D4-B')
          expected = set(plan['required_evidence'])
          assert len(expected) == 5
          assert set(plan['credited_evidence']) == expected
          assert plan['remaining_evidence'] == []
          assert plan['candidate'] is None and plan['candidate_status'] == 'not_selected'
          assert plan['selection_state'] == 'not_selected'
          assert plan['serialization_selection_state'] == 'not_selected'
          assert plan['schema_catalog_selection_state'] == 'not_selected'
          assert plan['contract_version_syntax_selection_state'] == 'not_selected'
          assert source['current_run_auto_credit'] is False and source['ledger_credit'] == []
          assert d4b['candidate'] is None and d4b['candidate_status'] == 'not_selected'
          assert d4b['state'] == 'evidence_complete_selection_pending'
          assert set(d4b['evidence_completed']) == expected and d4b['evidence_remaining'] == []
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4b_promotion_boundary=PASS credit=5/5 candidate=not_selected selection=separate d4=scoped authorities=not_granted')
          PY
