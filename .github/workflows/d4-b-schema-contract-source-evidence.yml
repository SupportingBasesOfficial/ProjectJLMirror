name: JLMIRROR D4-B Schema Contract Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/**'
      - 'tools/assurance/d4b_schema_contract/**'
      - 'tools/assurance/validate_d4b_evidence_plan.py'
      - 'tools/assurance/test_validate_d4b_evidence_plan.py'
      - 'tools/assurance/validate_d4b_selection.py'
      - 'tools/assurance/test_validate_d4b_selection.py'
      - 'docs/10-event-contracts/**'
      - 'docs/16-implementation-readiness/32-d4-b-schema-contract-source-evidence.md'
      - 'docs/16-implementation-readiness/33-d4-b-schema-contract-ledger-promotion.md'
      - 'docs/16-implementation-readiness/38-d4-b-bounded-c2-profile-selection.md'
      - '.github/workflows/d4-b-schema-contract-source-evidence.yml'
      - '.github/workflows/d4-b-schema-contract-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  schema-contract-source:
    name: D4-B schema contract source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-B source and selection tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4b_schema_contract/reference_model.py \
            tools/assurance/d4b_schema_contract/test_schema_contract.py \
            tools/assurance/d4b_schema_contract/validate_source_evidence.py \
            tools/assurance/d4b_schema_contract/emit_source_provenance.py \
            tools/assurance/validate_d4b_selection.py \
            tools/assurance/test_validate_d4b_selection.py

      - name: Falsify parser schema compatibility history and version escapes
        shell: bash
        working-directory: tools/assurance/d4b_schema_contract
        run: python3 test_schema_contract.py

      - name: Validate source history and current selected state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/d4b_schema_contract/validate_source_evidence.py
          python3 tools/assurance/test_validate_d4b_selection.py
          python3 tools/assurance/validate_d4b_selection.py .

      - name: Re-run Phase 10 contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tools/contracts/tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Assert source run remains historical and cannot add ledger credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/schema-contract/source-evidence-manifest.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          d4c_credits = [
              'ack_after_durable_responsibility_and_lease_ambiguity',
              'quarantine_redrive_current_authority_and_dedup_preservation',
              'bounded_message_batch_compression_and_parser_limits',
          ]
          expected_evidence = {
              'canonical_bounded_serialization_profile',
              'parser_ambiguity_and_duplicate_field_negative_vectors',
              'schema_catalog_semantic_manifest_compatibility_ci',
              'historical_reader_and_equivalence_profile_continuity',
              'contract_version_representation_and_breaking_change_vectors',
          }
          selected = {
              'serialization': {
                  'surface_policy': 'explicit_surface_bound_profiles',
                  'internal_broker': 'protobuf_profile',
                  'outbound_webhook': 'bounded_json_plus_json_schema_profile',
              },
              'schema_catalog': 'hybrid_reviewed_git_plus_registry_catalog',
              'contract_version': 'positive_integer_family_revision',
          }
          assert source['current_run_auto_credit'] is False and source['ledger_credit'] == []
          assert source['candidate'] is None and source['candidate_status'] == 'not_selected'
          assert source['serialization_selection_state'] == 'not_selected'
          assert source['schema_catalog_selection_state'] == 'not_selected'
          assert source['contract_version_syntax_selection_state'] == 'not_selected'
          assert plan['current_run_auto_credit'] is False
          assert plan['candidate'] == selected and plan['selection_state'] == 'selected'
          assert tracks['D4-B']['candidate'] == selected and tracks['D4-B']['candidate_status'] == 'selected_c2_profile'
          assert tracks['D4-B']['state'] == 'selected_candidate'
          assert set(tracks['D4-B']['evidence_completed']) == expected_evidence and tracks['D4-B']['evidence_remaining'] == []
          d4c = tracks['D4-C']
          assert d4c['candidate'] is None and d4c['candidate_status'] == 'not_selected' and d4c['state'] == 'candidate_selection_open'
          assert d4c['evidence_completed'] == d4c_credits
          assert d4c['evidence_remaining'] == [x for x in d4c['required_evidence'] if x not in d4c_credits]
          assert len(d4c['evidence_remaining']) == 6
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['candidate_status'] == 'not_selected'
          assert tracks['D4-D']['evidence_completed'] == []
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 15
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4b_source_nonpromotion=PASS source_credit=0 source_history=not_selected current_selection=selected_c2_profile promoted_credit=5 d4c=3/9 d4wide=15/26 d4=scoped authorities=not_granted')
          PY

      - name: Resolve exact workflow job identity and emit provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs = json.load(open('runtime-evidence/jobs.json', encoding='utf-8'))['jobs']
          matches = [job for job in jobs if job['name'] == 'D4-B schema contract source evidence']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one D4-B source job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4b_schema_contract/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-B schema contract source evidence" \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist exact source-run provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-b-schema-contract-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/resolved-source-run-provenance.json
          if-no-files-found: error
          retention-days: 90
