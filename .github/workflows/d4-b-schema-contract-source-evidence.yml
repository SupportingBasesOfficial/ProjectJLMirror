name: JLMIRROR D4-B Schema Contract Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/**'
      - 'tools/assurance/d4b_schema_contract/**'
      - 'docs/10-event-contracts/**'
      - 'docs/16-implementation-readiness/32-d4-b-schema-contract-source-evidence.md'
      - '.github/workflows/d4-b-schema-contract-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  schema-contract-source:
    name: D4-B schema contract source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-B source tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4b_schema_contract/reference_model.py \
            tools/assurance/d4b_schema_contract/test_schema_contract.py \
            tools/assurance/d4b_schema_contract/validate_source_evidence.py \
            tools/assurance/d4b_schema_contract/emit_source_provenance.py

      - name: Falsify parser schema compatibility history and version escapes
        shell: bash
        working-directory: tools/assurance/d4b_schema_contract
        run: python3 test_schema_contract.py

      - name: Validate source manifest and non-authority boundaries
        shell: bash
        run: python3 tools/assurance/d4b_schema_contract/validate_source_evidence.py

      - name: Re-run Phase 10 contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tools/contracts/tests/test_*.py; do
            PYTHONPATH=. python3 "$test_file"
          done

      - name: Assert source run does not select or promote D4-B
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/schema-contract/source-evidence-manifest.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          assert source['current_run_auto_credit'] is False and source['ledger_credit'] == []
          assert source['candidate'] is None and source['candidate_status'] == 'not_selected'
          assert source['serialization_selection_state'] == 'not_selected'
          assert source['schema_catalog_selection_state'] == 'not_selected'
          assert source['contract_version_syntax_selection_state'] == 'not_selected'
          assert tracks['D4-B']['candidate'] is None and tracks['D4-B']['evidence_completed'] == []
          assert tracks['D4-C']['candidate'] is None and tracks['D4-C']['evidence_completed'] == []
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['evidence_completed'] == []
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4b_source_nonpromotion=PASS evidence_source=5 ledger_credit=0 candidate=not_selected d4=scoped authorities=not_granted')
          PY

      - name: Resolve exact workflow job identity and emit provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs = json.load(open('runtime-evidence/jobs.json', encoding='utf-8'))['jobs']
          matches = [job for job in jobs if job['name'] == 'D4-B schema contract source evidence']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one D4-B source job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4b_schema_contract/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-B schema contract source evidence" \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist exact source-run provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-b-schema-contract-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/resolved-source-run-provenance.json
          if-no-files-found: error
          retention-days: 90
