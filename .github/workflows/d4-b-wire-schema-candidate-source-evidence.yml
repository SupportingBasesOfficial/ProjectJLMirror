name: JLMIRROR D4-B Wire Schema Candidate Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json'
      - 'implementation/d4-eventing-async/d4-b-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-b-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4b_wire_schema/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/36-d4-b-wire-schema-candidate-source-evidence.md'
      - '.github/workflows/d4-b-wire-schema-candidate-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4b-wire-schema-source:
    name: D4-B wire-schema candidate source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile source-evidence tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4b_wire_schema/evaluate_candidates.py \
            tools/assurance/d4b_wire_schema/validate_source_evidence.py \
            tools/assurance/d4b_wire_schema/test_source_evidence.py

      - name: Execute candidate behavior evidence
        shell: bash
        run: python3 tools/assurance/d4b_wire_schema/evaluate_candidates.py

      - name: Falsify candidate source-evidence weakening
        shell: bash
        run: python3 tools/assurance/d4b_wire_schema/test_source_evidence.py

      - name: Validate machine-owned source manifest
        shell: bash
        run: python3 tools/assurance/d4b_wire_schema/validate_source_evidence.py .

      - name: Preserve global D4 state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contracts
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert source-only non-selection boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-b-wire-schema-candidate-source.json').read_text())
          ledger = json.loads(Path('implementation/d4-eventing-async/d4-b-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          assert source['mode'] == 'candidate_source_evidence_only'
          assert source['test_profile_only'] is True
          assert source['selection_state'] == 'not_selected' and source['selection_authority'] == 'not_granted'
          assert source['current_run_auto_credit'] is False and source['ledger_credit'] == []
          assert set(source['candidate_results'].values()) == {'eligible_for_evidence_execution'}
          assert source['equivalent_reviewed_profile'] == 'insufficient_evidence'
          assert source['non_authority']['d4b_catalog_selection'] == 'not_selected'
          assert source['non_authority']['d4b_contract_version_selection'] == 'not_selected'
          assert ledger['candidate'] is None and ledger['selection_state'] == 'not_selected'
          assert tracks['D4-B']['candidate'] is None and tracks['D4-B']['state'] == 'evidence_complete_selection_pending'
          assert len(tracks['D4-B']['evidence_completed']) == 5
          assert tracks['D4-A']['candidate'] == 'kafka' and len(tracks['D4-A']['evidence_completed']) == 7
          assert tracks['D4-C']['candidate'] is None and tracks['D4-C']['evidence_completed'] == []
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['evidence_completed'] == []
          assert state['gate_state'] == 'scoped'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4b_wire_schema_source_boundary=PASS concrete_candidates=3 selection=not_selected ledger_credit=0 axis_b_c=not_selected d4=scoped authorities=not_granted')
          PY
