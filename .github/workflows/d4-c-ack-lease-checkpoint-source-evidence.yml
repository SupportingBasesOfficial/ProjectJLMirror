name: JLMIRROR D4-C Ack Lease Checkpoint Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json'
      - 'implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4c_ack_lease_checkpoint/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/10-event-contracts/phase-10-open-decisions.md'
      - 'docs/16-implementation-readiness/40-d4-c-ack-lease-checkpoint-source-evidence.md'
      - '.github/workflows/d4-c-ack-lease-checkpoint-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-ack-lease-checkpoint-source:
    name: D4-C OPEN-EVT-008 source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-C source and global D4 assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4c_ack_lease_checkpoint/evaluate_candidates.py \
            tools/assurance/d4c_ack_lease_checkpoint/validate_source_evidence.py \
            tools/assurance/d4c_ack_lease_checkpoint/test_source_evidence.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Execute and falsify OPEN-EVT-008 source semantics
        shell: bash
        run: python3 tools/assurance/d4c_ack_lease_checkpoint/test_source_evidence.py

      - name: Evaluate all concrete candidate classes
        shell: bash
        run: python3 tools/assurance/d4c_ack_lease_checkpoint/evaluate_candidates.py

      - name: Validate machine-owned source manifest
        shell: bash
        run: python3 tools/assurance/d4c_ack_lease_checkpoint/validate_source_evidence.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert source-only zero-credit boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          assert source['mode'] == 'candidate_source_evidence_only'
          assert source['source_decision'] == 'OPEN-EVT-008'
          assert source['evidence_id'] == 'ack_after_durable_responsibility_and_lease_ambiguity'
          assert source['selection_state'] == 'not_selected'
          assert source['selection_authority'] == 'not_granted'
          assert source['current_run_auto_credit'] is False
          assert source['ledger_credit'] == []
          assert set(source['candidate_results'].values()) == {'eligible_for_evidence_execution'}
          assert source['equivalent_reviewed_profile'] == 'insufficient_evidence'
          assert tracks['D4-A']['candidate'] == 'kafka' and len(tracks['D4-A']['evidence_completed']) == 7
          assert tracks['D4-B']['candidate_status'] == 'selected_c2_profile' and len(tracks['D4-B']['evidence_completed']) == 5
          assert tracks['D4-C']['candidate'] is None and tracks['D4-C']['candidate_status'] == 'not_selected'
          assert tracks['D4-C']['evidence_completed'] == [] and len(tracks['D4-C']['evidence_remaining']) == 9
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['evidence_completed'] == []
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 12
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4c_open_evt_008_source_boundary=PASS d4c=0_of_9 d4wide=12_of_26 selection=not_selected auto_credit=false')
          PY
