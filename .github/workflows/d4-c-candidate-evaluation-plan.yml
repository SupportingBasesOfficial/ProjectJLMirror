name: JLMIRROR D4-C Candidate Evaluation Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/validate_d4c_candidate_evaluation_plan.py'
      - 'tools/assurance/test_validate_d4c_candidate_evaluation_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/10-event-contracts/phase-10-open-decisions.md'
      - 'docs/16-implementation-readiness/39-d4-c-candidate-evaluation-plan.md'
      - '.github/workflows/d4-c-candidate-evaluation-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-candidate-evaluation-plan:
    name: D4-C candidate evaluation planning boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4-C and global D4 assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4c_candidate_evaluation_plan.py \
            tools/assurance/test_validate_d4c_candidate_evaluation_plan.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify D4-C evaluation-plan weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4c_candidate_evaluation_plan.py

      - name: Validate D4-C candidate-evaluation boundary
        shell: bash
        run: python3 tools/assurance/validate_d4c_candidate_evaluation_plan.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract tooling
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert historical evaluation remains non-promoting at current two-credit ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks = {t['track_id']: t for t in state['tracks']}
          credits = [
              'ack_after_durable_responsibility_and_lease_ambiguity',
              'quarantine_redrive_current_authority_and_dedup_preservation',
          ]
          assert plan['mode'] == 'candidate_evaluation_only'
          assert plan['selection_state'] == 'not_selected' and plan['selection_authority'] == 'not_granted'
          assert len(plan['axes']) == 9
          assert tracks['D4-A']['candidate'] == 'kafka' and len(tracks['D4-A']['evidence_completed']) == 7
          assert tracks['D4-B']['candidate_status'] == 'selected_c2_profile' and len(tracks['D4-B']['evidence_completed']) == 5
          d4c = tracks['D4-C']
          assert d4c['candidate'] is None and d4c['candidate_status'] == 'not_selected' and d4c['state'] == 'candidate_selection_open'
          assert d4c['evidence_completed'] == credits
          assert d4c['evidence_remaining'] == [x for x in d4c['required_evidence'] if x not in credits]
          assert len(d4c['evidence_remaining']) == 7
          assert tracks['D4-D']['candidate'] is None and tracks['D4-D']['candidate_status'] == 'not_selected' and tracks['D4-D']['evidence_completed'] == []
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 14
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4c_candidate_evaluation_boundary=PASS axes=9 evaluation_auto_credit=forbidden selection=not_selected current_d4c=2_of_9 d4d=0_of_5 d4wide=14/26 d4=scoped authorities=unchanged')
          PY
