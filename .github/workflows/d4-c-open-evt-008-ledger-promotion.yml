name: JLMIRROR D4-C OPEN-EVT-008 Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-008-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-011-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-quarantine-redrive-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-bounded-parser-limits-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-scoped-content-equivalence-source.json'
      - 'tools/assurance/validate_d4c_evidence_plan.py'
      - 'tools/assurance/test_validate_d4c_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - '.github/workflows/d4-c-open-evt-008-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-open-evt-008-promotion:
    name: D4-C OPEN-EVT-008 durable promotion continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile cumulative promotion assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/validate_d4c_evidence_plan.py tools/assurance/test_validate_d4c_evidence_plan.py tools/assurance/validate_d4_eventing_async_state.py tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify cumulative D4-C promotion weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4c_evidence_plan.py
      - name: Validate immutable OPEN-EVT-008 record and current cumulative ledger
        shell: bash
        run: python3 tools/assurance/validate_d4c_evidence_plan.py .
      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert OPEN-EVT-008 remains exactly the first historical credit within current eight-credit ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p8=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-008-promotion-v1.json').read_text()); plan=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text()); state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text()); d4c=next(t for t in state['tracks'] if t['track_id']=='D4-C')
          first='ack_after_durable_responsibility_and_lease_ambiguity'; second='quarantine_redrive_current_authority_and_dedup_preservation'; third='bounded_message_batch_compression_and_parser_limits'; fourth='scoped_content_equivalence_confidentiality_and_conflict_rejection'; fifth='outbox_claim_dispatch_ack_ambiguity_and_recovery_continuity'; sixth='producer_generation_nonresurrection_across_failover_restore'; seventh='privileged_bounded_replay_with_original_identity_and_effect_safety'; eighth='historical_reader_upcaster_semantic_and_equivalence_continuity'
          expected=[first,second,third,fourth,fifth,sixth,seventh,eighth]
          assert p8['promotion_id']=='d4-c-open-evt-008-promotion-v1' and p8['credited_evidence']==[first] and p8['credit_count']==1
          assert plan['ledger_credit_state']=='eight_of_nine' and plan['credited_evidence']==expected
          assert d4c['evidence_completed']==expected and d4c['evidence_remaining']==plan['remaining_evidence'] and len(d4c['evidence_remaining'])==1
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==20
          assert d4c['candidate'] is None and d4c['candidate_status']=='not_selected' and d4c['state']=='candidate_selection_open'
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted' and state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted' and state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          print('d4c_open_evt_008_continuity=PASS historical_credit=1 current_d4c=8_of_9 d4wide=20_of_26 artifact_retention_dependency=false authorities=unchanged')
          PY
