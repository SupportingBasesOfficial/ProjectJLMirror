name: JLMIRROR D4-C OPEN-EVT-009 Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-008-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-011-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-quarantine-redrive-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-bounded-parser-limits-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-scoped-content-equivalence-source.json'
      - 'tools/assurance/validate_d4c_evidence_plan.py'
      - 'tools/assurance/test_validate_d4c_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/43-d4-c-open-evt-009-ledger-promotion.md'
      - '.github/workflows/d4-c-open-evt-009-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-open-evt-009-promotion:
    name: D4-C OPEN-EVT-009 durable promotion continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile cumulative promotion assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/validate_d4c_evidence_plan.py tools/assurance/test_validate_d4c_evidence_plan.py tools/assurance/validate_d4_eventing_async_state.py tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify cumulative D4-C promotion weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4c_evidence_plan.py
      - name: Validate immutable OPEN-EVT-009 record and current cumulative ledger
        shell: bash
        run: python3 tools/assurance/validate_d4c_evidence_plan.py .
      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert OPEN-EVT-009 remains exactly the second historical credit within current complete ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p9=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json').read_text()); plan=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text()); state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text()); tracks={t['track_id']:t for t in state['tracks']}; d4c=tracks['D4-C']; d4d=tracks['D4-D']
          first='ack_after_durable_responsibility_and_lease_ambiguity'; second='quarantine_redrive_current_authority_and_dedup_preservation'; third='bounded_message_batch_compression_and_parser_limits'; fourth='scoped_content_equivalence_confidentiality_and_conflict_rejection'; fifth='outbox_claim_dispatch_ack_ambiguity_and_recovery_continuity'; sixth='producer_generation_nonresurrection_across_failover_restore'; seventh='privileged_bounded_replay_with_original_identity_and_effect_safety'; eighth='historical_reader_upcaster_semantic_and_equivalence_continuity'; ninth='recovery_generation_rf_inventory_reconciliation_and_activation_gates'; d4d_credits=['workload_identity_to_broker_credential_adapter_least_privilege','tenant_and_contract_scoped_producer_consumer_authorization','message_protection_key_authority_and_historical_verifier_continuity','secret_credential_payload_exclusion_and_erasure_boundary','trace_context_observability_only_validation_and_redaction']
          expected=[first,second,third,fourth,fifth,sixth,seventh,eighth,ninth]
          expected_c={'ack_visibility_lease_and_checkpoint':'durable_inbox_claim_then_broker_ack_profile','quarantine_and_redrive':'hybrid_platform_quarantine_store_plus_broker_dlq','bounded_message_payload_batch_and_compression':'layered_transport_and_application_bounds_profile','scoped_content_equivalence_authority':'hybrid_equivalence_authority_profile','outbox_claim_dispatch_and_ack_ambiguity':'compare_and_swap_lease_claim_profile','producer_source_generation':'authority_issued_epoch_generation','privileged_replay_and_event_history':'hybrid_history_archive_plus_replay_controller_profile','historical_reader_and_upcaster':'in_process_versioned_reader_upcaster_registry','recovery_generation_reconciliation_and_activation':'hybrid_generation_manifest_plus_multi_store_reconciler_profile'}
          assert p9['promotion_id']=='d4-c-open-evt-009-promotion-v1' and p9['credited_evidence']==[second] and p9['credit_count']==1
          assert plan['ledger_credit_state']=='nine_of_nine' and plan['credited_evidence']==expected and plan['remaining_evidence']==[]
          assert d4c['candidate']==expected_c and d4c['candidate_status']=='selected_c2_delivery_recovery_profile' and d4c['state']=='selected_candidate'
          assert d4c['evidence_completed']==expected and d4c['evidence_remaining']==[]
          assert d4d['candidate']=={'workload_identity_to_broker_credential_adapter': 'derived_short_lived_broker_native_credential_adapter', 'tenant_and_contract_scoped_producer_consumer_authorization': 'broker_acl_projection_adapter', 'message_protection_key_authority_and_historical_verifier_continuity': 'kms_backed_envelope_or_transport_protection_profile', 'secret_credential_payload_exclusion_and_erasure_boundary': 'reference_only_secret_authority_profile', 'trace_context_observability_only_validation_and_redaction': 'w3c_trace_context_bounded_profile'} and d4d['candidate_status']=='selected_c2_security_profile' and d4d['state']=='selected_candidate'
          assert d4d['evidence_completed']==d4d_credits
          assert d4d['evidence_remaining']==[]
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted' and state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted' and state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          print('d4c_open_evt_009_continuity=PASS historical_credit=2 current_d4c=9_of_9_selected current_d4d=5_of_5 d4wide=26_of_26 artifact_retention_dependency=false authorities=unchanged')
          PY
