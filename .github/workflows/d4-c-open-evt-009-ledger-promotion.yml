name: JLMIRROR D4-C OPEN-EVT-009 Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-008-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-quarantine-redrive-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-bounded-parser-limits-source.json'
      - 'tools/assurance/validate_d4c_evidence_plan.py'
      - 'tools/assurance/test_validate_d4c_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/43-d4-c-open-evt-009-ledger-promotion.md'
      - '.github/workflows/d4-c-open-evt-009-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-open-evt-009-promotion:
    name: D4-C OPEN-EVT-009 durable promotion continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile cumulative promotion assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4c_evidence_plan.py \
            tools/assurance/test_validate_d4c_evidence_plan.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify cumulative D4-C promotion weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4c_evidence_plan.py

      - name: Validate immutable OPEN-EVT-009 record and current cumulative ledger
        shell: bash
        run: python3 tools/assurance/validate_d4c_evidence_plan.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert OPEN-EVT-009 remains exactly the second historical credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p9 = json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json').read_text())
          plan = json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text())
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          d4c = next(t for t in state['tracks'] if t['track_id'] == 'D4-C')
          first = 'ack_after_durable_responsibility_and_lease_ambiguity'
          second = 'quarantine_redrive_current_authority_and_dedup_preservation'
          third = 'bounded_message_batch_compression_and_parser_limits'
          assert p9['promotion_id'] == 'd4-c-open-evt-009-promotion-v1'
          assert p9['credited_evidence'] == [second] and p9['credit_count'] == 1
          assert plan['ledger_credit_state'] == 'three_of_nine'
          assert plan['credited_evidence'] == [first, second, third]
          assert d4c['evidence_completed'] == [first, second, third]
          assert d4c['evidence_remaining'] == plan['remaining_evidence'] and len(d4c['evidence_remaining']) == 6
          assert sum(len(t['evidence_completed']) for t in state['tracks']) == 15
          assert d4c['candidate'] is None and d4c['candidate_status'] == 'not_selected' and d4c['state'] == 'candidate_selection_open'
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          print('d4c_open_evt_009_continuity=PASS historical_credit=2 current_d4c=3_of_9 d4wide=15_of_26 artifact_retention_dependency=false authorities=unchanged')
          PY
