name: JLMIRROR D4-C OPEN-EVT-010 Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-008-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-009-promotion-v1.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-ack-lease-checkpoint-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-quarantine-redrive-source.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-c-bounded-parser-limits-source.json'
      - 'tools/assurance/validate_d4c_evidence_plan.py'
      - 'tools/assurance/test_validate_d4c_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/45-d4-c-open-evt-010-ledger-promotion.md'
      - '.github/workflows/d4-c-open-evt-010-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  d4c-open-evt-010-promotion:
    name: D4-C OPEN-EVT-010 reviewed source ledger promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile promotion and global state assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4c_evidence_plan.py \
            tools/assurance/test_validate_d4c_evidence_plan.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify D4-C cumulative promotion weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4c_evidence_plan.py

      - name: Validate current D4-C cumulative promotion state
        shell: bash
        run: python3 tools/assurance/validate_d4c_evidence_plan.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Determine whether this PR changes OPEN-EVT-010 promotion authority
        id: promotion_delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "d4c_open_evt_010_promotion_delta=steady_state reason=no_pull_request_base"
            exit 0
          fi
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base_sha = os.environ['BASE_SHA']
          promotion_path = 'implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json'
          proc = subprocess.run(['git','show',f'{base_sha}:{promotion_path}'], check=False, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          base_promotion = proc.stdout if proc.returncode == 0 else None
          head_promotion = Path(promotion_path).read_bytes()
          changed = base_promotion != head_promotion
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
          print(f"d4c_open_evt_010_promotion_delta={'changed' if changed else 'steady_state'} authority_source=own_promotion_record aggregate_ledger_ignored=true")
          PY

      - name: Admit exact reviewed OPEN-EVT-010 source evidence from live GitHub state
        if: steps.promotion_delta.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'unexpected in later aggregate promotion: OPEN-EVT-010 own record changed; live admission intentionally required'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json').read_text())
          assert p['promotion_id']=='d4-c-open-evt-010-promotion-v1'
          print('open_evt_010_own_record_changed=true')
          PY
          exit 1

      - name: Validate steady-state durable D4-C OPEN-EVT-010 promotion provenance
        if: steps.promotion_delta.outputs.changed == 'false'
        shell: bash
        run: echo 'd4c_open_evt_010_promotion_live_admission=SKIP promotion_unchanged=true aggregate_ledger_change_ignored=true artifact_retention_dependency=false durable_records_and_digests=validated'

      - name: Assert OPEN-EVT-010 history is preserved under current fourth credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          record=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-c-open-evt-010-promotion-v1.json').read_text())
          d4c=next(t for t in state['tracks'] if t['track_id']=='D4-C')
          expected=[
            'ack_after_durable_responsibility_and_lease_ambiguity',
            'quarantine_redrive_current_authority_and_dedup_preservation',
            'bounded_message_batch_compression_and_parser_limits',
            'scoped_content_equivalence_confidentiality_and_conflict_rejection',
          ]
          assert record['credited_evidence']==['bounded_message_batch_compression_and_parser_limits'] and record['credit_count']==1
          assert plan['ledger_credit_state']=='four_of_nine' and plan['credited_evidence']==expected and len(plan['remaining_evidence'])==5
          assert d4c['evidence_completed']==expected and d4c['evidence_remaining']==plan['remaining_evidence']
          assert d4c['candidate'] is None and d4c['candidate_status']=='not_selected' and d4c['state']=='candidate_selection_open'
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==16
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          print('d4c_open_evt_010_promotion_continuity=PASS own_credit=third current_d4c=4_of_9 d4wide=16_of_26 artifact_retention_dependency=false selection=not_selected authorities=unchanged')
          PY
