name: JLMIRROR D4-C Outbox Claim Dispatch Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-c-outbox-claim-dispatch-source.json'
      - 'implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4c_outbox_claim_dispatch/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/48-d4-c-outbox-claim-dispatch-source-evidence.md'
      - '.github/workflows/d4-c-outbox-claim-dispatch-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d4c-outbox-claim-dispatch-source:
    name: D4-C OPEN-EVT-012 source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile source and global assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/d4c_outbox_claim_dispatch/evaluate_candidates.py \
            tools/assurance/d4c_outbox_claim_dispatch/test_source_evidence.py \
            tools/assurance/d4c_outbox_claim_dispatch/validate_source_evidence.py \
            tools/assurance/d4c_outbox_claim_dispatch/emit_source_provenance.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify OPEN-EVT-012 continuity weakening
        shell: bash
        working-directory: tools/assurance/d4c_outbox_claim_dispatch
        run: python3 test_source_evidence.py

      - name: Evaluate candidate classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python3 tools/assurance/d4c_outbox_claim_dispatch/evaluate_candidates.py > runtime-evidence/candidate-results.json

      - name: Validate machine-owned source manifest and runtime results
        shell: bash
        run: python3 tools/assurance/d4c_outbox_claim_dispatch/validate_source_evidence.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contract suite
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Preserve source-time non-promotion while admitting current complete ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-c-outbox-claim-dispatch-source.json').read_text())
          plan=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks={t['track_id']:t for t in state['tracks']}
          credits=[
            'ack_after_durable_responsibility_and_lease_ambiguity',
            'quarantine_redrive_current_authority_and_dedup_preservation',
            'bounded_message_batch_compression_and_parser_limits',
            'scoped_content_equivalence_confidentiality_and_conflict_rejection',
            'outbox_claim_dispatch_ack_ambiguity_and_recovery_continuity',
            'producer_generation_nonresurrection_across_failover_restore',
            'privileged_bounded_replay_with_original_identity_and_effect_safety',
            'historical_reader_upcaster_semantic_and_equivalence_continuity',
            'recovery_generation_rf_inventory_reconciliation_and_activation_gates',
          ]
          selected_d4c={'ack_visibility_lease_and_checkpoint':'durable_inbox_claim_then_broker_ack_profile','quarantine_and_redrive':'hybrid_platform_quarantine_store_plus_broker_dlq','bounded_message_payload_batch_and_compression':'layered_transport_and_application_bounds_profile','scoped_content_equivalence_authority':'hybrid_equivalence_authority_profile','outbox_claim_dispatch_and_ack_ambiguity':'compare_and_swap_lease_claim_profile','producer_source_generation':'authority_issued_epoch_generation','privileged_replay_and_event_history':'hybrid_history_archive_plus_replay_controller_profile','historical_reader_and_upcaster':'in_process_versioned_reader_upcaster_registry','recovery_generation_reconciliation_and_activation':'hybrid_generation_manifest_plus_multi_store_reconciler_profile'}
          d4d_credits=['workload_identity_to_broker_credential_adapter_least_privilege','tenant_and_contract_scoped_producer_consumer_authorization','message_protection_key_authority_and_historical_verifier_continuity','secret_credential_payload_exclusion_and_erasure_boundary','trace_context_observability_only_validation_and_redaction']
          assert source['mode']=='candidate_source_evidence_only'
          assert source['source_decision']=='OPEN-EVT-012'
          assert source['current_run_auto_credit'] is False and source['ledger_credit']==[]
          assert source['non_authority']['d4c_ledger_credit']=='current_4_of_9_unchanged'
          assert source['non_authority']['open_evt_012_ledger_credit']=='uncredited'
          assert source['selection_state']=='not_selected' and source['selection_authority']=='not_granted'
          assert set(source['candidate_results'].values())=={'eligible_for_evidence_execution'}
          assert plan['ledger_credit_state']=='nine_of_nine' and plan['credited_evidence']==credits and plan['remaining_evidence']==[]
          assert source['evidence_id'] in plan['credited_evidence'] and source['evidence_id'] not in plan['remaining_evidence']
          d4c=tracks['D4-C']
          assert d4c['evidence_completed']==credits and d4c['evidence_remaining']==[]
          assert d4c['candidate']==selected_d4c and d4c['candidate_status']=='selected_c2_delivery_recovery_profile' and d4c['state']=='selected_candidate'
          d4d=tracks['D4-D']; assert d4d['candidate']=={'workload_identity_to_broker_credential_adapter': 'derived_short_lived_broker_native_credential_adapter', 'tenant_and_contract_scoped_producer_consumer_authorization': 'broker_acl_projection_adapter', 'message_protection_key_authority_and_historical_verifier_continuity': 'kms_backed_envelope_or_transport_protection_profile', 'secret_credential_payload_exclusion_and_erasure_boundary': 'reference_only_secret_authority_profile', 'trace_context_observability_only_validation_and_redaction': 'w3c_trace_context_bounded_profile'} and d4d['candidate_status']=='selected_c2_security_profile' and d4d['state']=='selected_candidate'
          assert d4d['evidence_completed']==d4d_credits and d4d['evidence_remaining']==[]
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='scoped'
          assert state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted'
          assert state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none'
          assert state['c3_numeric_topology_authority']=='not_selected'
          print('d4c_open_evt_012_source_boundary=PASS source_time_credit=0 source_snapshot=4_of_9 current_d4c=9_of_9 current_selection=selected_c2_delivery_recovery_profile d4d=5_of_5 d4wide=26_of_26 authorities=unchanged')
          PY

      - name: Resolve exact workflow job identity and emit immutable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs=json.load(open('runtime-evidence/jobs.json',encoding='utf-8'))['jobs']
          matches=[j for j in jobs if j['name']=='D4-C OPEN-EVT-012 source evidence']
          if len(matches)!=1: raise SystemExit(f'expected one OPEN-EVT-012 source job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4c_outbox_claim_dispatch/emit_source_provenance.py \
            --repository-sha "$EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job-id "$job_id" \
            --job-name "D4-C OPEN-EVT-012 source evidence" \
            --candidate-results runtime-evidence/candidate-results.json \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist exact source-run provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-c-outbox-claim-dispatch-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-evidence/resolved-source-run-provenance.json
            runtime-evidence/candidate-results.json
          if-no-files-found: error
          retention-days: 90
