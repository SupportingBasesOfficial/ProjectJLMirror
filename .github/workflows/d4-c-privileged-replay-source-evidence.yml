name: JLMIRROR D4-C Privileged Replay Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-c-privileged-replay-source.json'
      - 'implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4c_privileged_replay/**'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/51-d4-c-open-evt-014-source-evidence.md'
      - '.github/workflows/d4-c-privileged-replay-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  open-evt-014-source-evidence:
    name: D4-C OPEN-EVT-014 source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ANALYZED_SHA }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ANALYZED_SHA}"

      - name: Compile validate and falsify privileged replay source package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/d4c_privileged_replay/*.py
          mkdir -p runtime-evidence
          python3 tools/assurance/d4c_privileged_replay/evaluate_candidates.py > runtime-evidence/candidate-results.json
          (cd tools/assurance/d4c_privileged_replay && python3 test_source_evidence.py)
          python3 tools/assurance/d4c_privileged_replay/validate_source_evidence.py

      - name: Preserve current D4 state and Phase 10 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4c_evidence_plan.py
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert source remains non-promoting and authorities unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-c-privileged-replay-source.json').read_text())
          plan=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks={t['track_id']:t for t in state['tracks']}
          assert p['current_run_auto_credit'] is False and p['ledger_credit']==[]
          assert p['selection_state']=='not_selected' and p['selection_authority']=='not_granted'
          assert p['non_authority']['d4c_ledger_credit']=='current_6_of_9_unchanged'
          assert p['non_authority']['open_evt_014_ledger_credit']=='uncredited'
          assert plan['ledger_credit_state']=='six_of_nine'
          assert 'privileged_bounded_replay_with_original_identity_and_effect_safety' in plan['remaining_evidence']
          assert 'privileged_bounded_replay_with_original_identity_and_effect_safety' not in plan['credited_evidence']
          assert tracks['D4-C']['candidate'] is None and tracks['D4-C']['candidate_status']=='not_selected'
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==18
          assert state['gate_state']=='scoped'
          assert state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted'
          assert state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none'
          assert state['c3_numeric_topology_authority']=='not_selected'
          print('open_evt_014_source_boundary=PASS source_credit=0 current_d4c=6/9 current_d4wide=18/26 selection=none authorities=unchanged')
          PY

      - name: Resolve exact workflow job identity and emit immutable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs=json.load(open('runtime-evidence/jobs.json',encoding='utf-8'))['jobs']
          matches=[j for j in jobs if j['name']=='D4-C OPEN-EVT-014 source evidence']
          if len(matches)!=1: raise SystemExit(f'expected one OPEN-EVT-014 source job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/d4c_privileged_replay/emit_source_provenance.py \
            --repository-sha "${ANALYZED_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-id "$job_id" \
            --job-name "D4-C OPEN-EVT-014 source evidence" \
            --candidate-results runtime-evidence/candidate-results.json \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json

      - name: Persist exact source-run provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-c-privileged-replay-source-${{ env.ANALYZED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-evidence/resolved-source-run-provenance.json
            runtime-evidence/candidate-results.json
          if-no-files-found: error
          retention-days: 90
