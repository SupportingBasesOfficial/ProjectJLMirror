name: JLMIRROR D4-C Bounded C2 Delivery Recovery Profile Selection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-c-selection-record.json'
      - 'implementation/d4-eventing-async/d4-c-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json'
      - 'tools/assurance/validate_d4c_selection.py'
      - 'tools/assurance/test_validate_d4c_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/63-d4-c-bounded-c2-delivery-recovery-profile-selection.md'
      - '.github/workflows/d4-c-profile-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4c-profile-selection:
    name: D4-C bounded C2 delivery recovery profile selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRESELECTION_MAIN: 8d49980d45256a86a6005a93cc71f5518622cc90
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit and immutable historical evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$PRESELECTION_MAIN^{commit}"
          git diff --exit-code "$PRESELECTION_MAIN" -- \
            implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json \
            implementation/d4-eventing-async/source-evidence
      - name: Compile selection assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4c_selection.py \
            tools/assurance/test_validate_d4c_selection.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify D4-C selection weakening
        run: python3 tools/assurance/test_validate_d4c_selection.py
      - name: Validate selected D4-C delivery recovery profile
        run: python3 tools/assurance/validate_d4c_selection.py .
      - name: Preserve global D4 scoped state
        run: |
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contracts
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert terminal D4-C disposition without D4 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          selection=json.loads(Path('implementation/d4-eventing-async/d4-c-selection-record.json').read_text())
          ledger=json.loads(Path('implementation/d4-eventing-async/d4-c-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          evaluation=json.loads(Path('implementation/d4-eventing-async/d4-c-candidate-evaluation-plan.json').read_text())
          expected={k:v['mechanism_class'] for k,v in selection['profile'].items()}
          tracks={t['track_id']:t for t in state['tracks']}
          assert ledger['candidate']==expected and ledger['candidate_status']=='selected_c2_delivery_recovery_profile'
          assert tracks['D4-C']['candidate']==expected and tracks['D4-C']['candidate_status']=='selected_c2_delivery_recovery_profile' and tracks['D4-C']['state']=='selected_candidate'
          assert len(tracks['D4-C']['evidence_completed'])==9 and tracks['D4-C']['evidence_remaining']==[]
          assert all(t['state']=='selected_candidate' for t in tracks.values())
          assert evaluation['selection_state']=='not_selected' and evaluation['selection_authority']=='not_granted'
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          assert selection['separate_d4_acceptance_required'] is True
          print('d4c_selection_boundary=PASS profile=selected_c2_delivery_recovery_profile evidence=9/9 d4wide=26/26 all_tracks_terminal=true d4=scoped acceptance=separate authorities=unchanged')
          PY
