name: JLMIRROR D4-D Candidate Evaluation Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/d4-d-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/validate_d4d_candidate_evaluation_plan.py'
      - 'tools/assurance/test_validate_d4d_candidate_evaluation_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/10-event-contracts/phase-10-open-decisions.md'
      - 'docs/10-event-contracts/security-tenant-context-and-data-classification.md'
      - 'docs/16-implementation-readiness/56-d4-d-candidate-evaluation-plan.md'
      - '.github/workflows/d4-d-candidate-evaluation-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4d-candidate-evaluation-plan:
    name: D4-D candidate evaluation planning boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile D4-D and global D4 assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/validate_d4d_candidate_evaluation_plan.py tools/assurance/test_validate_d4d_candidate_evaluation_plan.py tools/assurance/validate_d4_eventing_async_state.py tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify D4-D evaluation-plan weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4d_candidate_evaluation_plan.py
      - name: Validate D4-D candidate-evaluation boundary
        shell: bash
        run: python3 tools/assurance/validate_d4d_candidate_evaluation_plan.py .
      - name: Preserve separately accepted D4 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contract tooling
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert historical evaluation plan remains non-selecting at current complete ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json').read_text())
          ledger=json.loads(Path('implementation/d4-eventing-async/d4-d-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks={t['track_id']:t for t in state['tracks']}
          credits=['workload_identity_to_broker_credential_adapter_least_privilege','tenant_and_contract_scoped_producer_consumer_authorization','message_protection_key_authority_and_historical_verifier_continuity','secret_credential_payload_exclusion_and_erasure_boundary','trace_context_observability_only_validation_and_redaction']
          assert plan['mode']=='candidate_evaluation_only'
          assert plan['selection_state']=='not_selected' and plan['selection_authority']=='not_granted' and len(plan['axes'])==5
          assert ledger['ledger_credit_state']=='five_of_five' and ledger['credited_evidence']==credits and ledger['remaining_evidence']==[]
          d4d=tracks['D4-D']
          assert d4d['candidate']=={'workload_identity_to_broker_credential_adapter': 'derived_short_lived_broker_native_credential_adapter', 'tenant_and_contract_scoped_producer_consumer_authorization': 'broker_acl_projection_adapter', 'message_protection_key_authority_and_historical_verifier_continuity': 'kms_backed_envelope_or_transport_protection_profile', 'secret_credential_payload_exclusion_and_erasure_boundary': 'reference_only_secret_authority_profile', 'trace_context_observability_only_validation_and_redaction': 'w3c_trace_context_bounded_profile'} and d4d['candidate_status']=='selected_c2_security_profile' and d4d['state']=='selected_candidate'
          assert d4d['evidence_completed']==credits and d4d['evidence_remaining']==[]
          assert tracks['D4-C']['evidence_remaining']==[] and len(tracks['D4-C']['evidence_completed'])==9
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='separately_accepted' and state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted'
          assert state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          print('d4d_candidate_evaluation_boundary=PASS axes=5 historical_gate=scoped historical_plan_nonselecting=true current_gate=separately_accepted current_d4d=5_of_5 d4wide=26/26 authorities=unchanged')
          PY
