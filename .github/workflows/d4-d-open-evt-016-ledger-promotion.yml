name: JLMIRROR D4-D OPEN-EVT-016 Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-d-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-016-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-workload-identity/source-evidence-manifest.json'
      - 'tools/assurance/validate_d4d_evidence_plan.py'
      - 'tools/assurance/test_validate_d4d_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'tools/assurance/validate_d4d_candidate_evaluation_plan.py'
      - 'tools/assurance/validate_d4d_workload_identity_source.py'
      - 'docs/16-implementation-readiness/57-d4-d-open-evt-016-ledger-promotion.md'
      - '.github/workflows/d4-d-open-evt-016-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  d4d-open-evt-016-promotion:
    name: D4-D OPEN-EVT-016 reviewed source ledger promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile promotion and global assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4d_evidence_plan.py \
            tools/assurance/test_validate_d4d_evidence_plan.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py \
            tools/assurance/validate_d4d_candidate_evaluation_plan.py \
            tools/assurance/validate_d4d_workload_identity_source.py

      - name: Falsify D4-D first-credit weakening
        run: python3 tools/assurance/test_validate_d4d_evidence_plan.py

      - name: Validate D4-D cumulative promotion ledger
        run: python3 tools/assurance/validate_d4d_evidence_plan.py .

      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4d_candidate_evaluation_plan.py
          python3 tools/assurance/validate_d4d_candidate_evaluation_plan.py .
          python3 tools/assurance/test_validate_d4d_workload_identity_source.py
          python3 tools/assurance/validate_d4d_workload_identity_source.py .

      - name: Preserve Phase 10 contract suite
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Admit exact reviewed OPEN-EVT-016 source evidence from live GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/promotion.env
          import json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-016-promotion-v1.json').read_text())
          w=p['source_workflow']
          for k,v in {
              'SOURCE_PR':p['source_pr'],'SOURCE_REVIEW_ID':p['source_review']['review_id'],
              'SOURCE_HEAD':p['source_reviewed_head'],'SOURCE_MERGE':p['source_merge_commit'],
              'WORKFLOW_ID':w['workflow_id'],'WORKFLOW_PATH':w['workflow_path'],
              'SOURCE_HEAD_BRANCH':w['source_head_branch'],'RUN_ID':w['run_id'],
              'RUN_ATTEMPT':w['run_attempt'],'JOB_ID':w['job_id'],'ARTIFACT_ID':w['artifact_id'],
              'ARTIFACT_NAME':w['artifact_name'],'ARTIFACT_DIGEST':w['artifact_digest'],
          }.items(): print(f'{k}={v}')
          PY
          source /tmp/promotion.env
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" -o /tmp/source-pr.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$SOURCE_REVIEW_ID" -o /tmp/source-review.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -o /tmp/run.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" -o /tmp/job.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" -o /tmp/artifact.json
          curl --fail --silent --show-error --location "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/source.zip
          rm -rf /tmp/source-artifact && mkdir /tmp/source-artifact
          unzip -q /tmp/source.zip -d /tmp/source-artifact
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-016-promotion-v1.json').read_text())
          w=p['source_workflow']; source=Path(p['source_manifest']['path'])
          source_pr=json.load(open('/tmp/source-pr.json')); review=json.load(open('/tmp/source-review.json'))
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); artifact=json.load(open('/tmp/artifact.json'))
          assert source_pr['number']==108 and source_pr['state']=='closed' and source_pr.get('merged_at') is not None
          assert source_pr['head']['sha']==p['source_reviewed_head']
          assert source_pr['merge_commit_sha']==p['source_merge_commit']==p['promotion_base']
          assert review['id']==p['source_review']['review_id'] and review['commit_id']==p['source_reviewed_head'] and review['state']=='COMMENTED'
          body=review.get('body') or ''
          assert 'CLEAN / READY_FOR_MERGE' in body
          assert p['source_reviewed_head'] in body
          assert 'Pre-ready: 9/9 SUCCESS.' in body and 'Post-ready: 9/9 SUCCESS.' in body
          assert 'Review threads: 0.' in body
          assert run['id']==w['run_id'] and run['workflow_id']==w['workflow_id'] and run['path']==w['workflow_path']
          assert run['event']=='pull_request' and run['head_sha']==p['source_reviewed_head'] and run['conclusion']=='success'
          assert job['id']==w['job_id'] and job['run_id']==w['run_id'] and job['name']==w['job_name'] and job['conclusion']=='success'
          assert artifact['id']==w['artifact_id'] and artifact['name']==w['artifact_name'] and artifact['digest']==w['artifact_digest'] and artifact['expired'] is False
          files={x.name for x in Path('/tmp/source-artifact').iterdir() if x.is_file()}
          assert files=={'resolved-source-run-provenance.json'}
          provenance=json.loads(Path('/tmp/source-artifact/resolved-source-run-provenance.json').read_text())
          assert provenance['repository_sha']==p['source_reviewed_head'] and provenance['workflow_run_id']==w['run_id']
          assert provenance['workflow_run_attempt']==w['run_attempt'] and provenance['job_id']==w['job_id'] and provenance['job_name']==w['job_name']
          assert provenance['source_decision']=='OPEN-EVT-016'
          assert provenance['evidence_id']=='workload_identity_to_broker_credential_adapter_least_privilege'
          assert provenance['canonical_identity_authority']=='IR-D-002'
          assert provenance['current_run_auto_credit'] is False and provenance['ledger_credit']==[]
          assert provenance['selection']=='not_selected' and provenance['selection_authority']=='not_granted'
          assert all(provenance['proof_results'].values())
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest==p['source_manifest']['sha256']==provenance['source_manifest_sha256']
          print('d4d_open_evt_016_promotion_live_admission=PASS')
          PY

      - name: Assert first promotion remains bound inside cumulative D4-D ledger
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('implementation/d4-eventing-async/d4-d-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          source=json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-d-workload-identity/source-evidence-manifest.json').read_text())
          first_promotion=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-016-promotion-v1.json').read_text())
          d4d=next(t for t in state['tracks'] if t['track_id']=='D4-D')
          first='workload_identity_to_broker_credential_adapter_least_privilege'
          second='tenant_and_contract_scoped_producer_consumer_authorization'
          third='message_protection_key_authority_and_historical_verifier_continuity'
          assert source['current_run_auto_credit'] is False and source['ledger_credit']==[]
          assert source['source_time_state']['d4d']=='0_of_5_unselected' and source['source_time_state']['d4wide']=='21_of_26'
          assert first_promotion['promotion_id']=='d4-d-open-evt-016-promotion-v1'
          assert first_promotion['credited_evidence']==[first] and first_promotion['credit_count']==1
          assert plan['ledger_credit_state']=='three_of_five' and plan['credited_evidence']==[first,second,third] and len(plan['remaining_evidence'])==2
          assert d4d['evidence_completed']==[first,second,third] and len(d4d['evidence_remaining'])==2
          assert d4d['candidate'] is None and d4d['candidate_status']=='not_selected' and d4d['state']=='candidate_selection_open'
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==24
          assert state['gate_state']=='scoped'
          assert state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted'
          assert state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none'
          assert state['c3_numeric_topology_authority']=='not_selected'
          print('d4d_open_evt_016_promotion_boundary=PASS source_snapshot=0_of_5 first_promotion=preserved current_d4d=3_of_5 d4wide=24_of_26 selection=not_selected authorities=unchanged')
          PY
