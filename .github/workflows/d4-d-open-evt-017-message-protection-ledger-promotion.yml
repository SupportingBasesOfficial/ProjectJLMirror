name: JLMIRROR D4-D OPEN-EVT-017 Message Protection Ledger Promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-d-evidence-plan.json'
      - 'implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-017-message-protection-promotion-v1.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-message-protection-key-authority/source-evidence-manifest.json'
      - 'tools/assurance/validate_d4d_evidence_plan.py'
      - 'tools/assurance/test_validate_d4d_evidence_plan.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/validate_d4d_candidate_evaluation_plan.py'
      - 'tools/assurance/validate_d4d_message_protection_source.py'
      - 'tools/assurance/test_validate_d4d_message_protection_source.py'
      - '.github/workflows/d4-d-open-evt-017-message-protection-ledger-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: D4-D OPEN-EVT-017 message protection reviewed source ledger promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile promotion assurance
        run: python3 -m py_compile tools/assurance/validate_d4d_evidence_plan.py tools/assurance/test_validate_d4d_evidence_plan.py tools/assurance/validate_d4_eventing_async_state.py tools/assurance/validate_d4d_candidate_evaluation_plan.py tools/assurance/validate_d4d_message_protection_source.py tools/assurance/test_validate_d4d_message_protection_source.py
      - name: Falsify cumulative promotion weakening
        run: python3 tools/assurance/test_validate_d4d_evidence_plan.py
      - name: Validate current cumulative D4-D ledger
        run: python3 tools/assurance/validate_d4d_evidence_plan.py .
      - name: Preserve current message protection source history
        run: |
          python3 tools/assurance/test_validate_d4d_message_protection_source.py
          python3 tools/assurance/validate_d4d_message_protection_source.py .
      - name: Preserve global scoped authority
        run: |
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
          python3 tools/assurance/test_validate_d4d_candidate_evaluation_plan.py
          python3 tools/assurance/validate_d4d_candidate_evaluation_plan.py .
      - name: Preserve Phase 10 contract suite
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Admit exact reviewed third source from live GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/p.env
          import json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-017-message-protection-promotion-v1.json').read_text()); w=p['source_workflow']
          for k,v in {'SOURCE_PR':p['source_pr'],'REVIEW_ID':p['source_review']['review_id'],'SOURCE_HEAD':p['source_reviewed_head'],'SOURCE_MERGE':p['source_merge_commit'],'WORKFLOW_ID':w['workflow_id'],'RUN_ID':w['run_id'],'JOB_ID':w['job_id'],'ARTIFACT_ID':w['artifact_id']}.items(): print(f'{k}={v}')
          PY
          source /tmp/p.env
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" -o /tmp/pr.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR/reviews/$REVIEW_ID" -o /tmp/review.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -o /tmp/run.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" -o /tmp/job.json
          curl --fail --silent --show-error "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" -o /tmp/artifact.json
          curl --fail --silent --show-error --location "${headers[@]}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/source.zip
          rm -rf /tmp/source-artifact && mkdir /tmp/source-artifact && unzip -q /tmp/source.zip -d /tmp/source-artifact
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-017-message-protection-promotion-v1.json').read_text()); w=p['source_workflow']; src=Path(p['source_manifest']['path'])
          pr=json.load(open('/tmp/pr.json')); r=json.load(open('/tmp/review.json')); run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); a=json.load(open('/tmp/artifact.json'))
          assert pr['number']==112 and pr['state']=='closed' and pr.get('merged_at') is not None and pr['head']['sha']==p['source_reviewed_head'] and pr['merge_commit_sha']==p['source_merge_commit']
          assert r['id']==p['source_review']['review_id'] and r['commit_id']==p['source_reviewed_head'] and r['state']=='COMMENTED'
          assert run['id']==w['run_id'] and run['workflow_id']==w['workflow_id'] and run['path']==w['workflow_path'] and run['event']=='pull_request' and run['head_sha']==p['source_reviewed_head'] and run['conclusion']=='success'
          assert job['id']==w['job_id'] and job['run_id']==w['run_id'] and job['name']==w['job_name'] and job['conclusion']=='success'
          assert a['id']==w['artifact_id'] and a['name']==w['artifact_name'] and a['digest']==w['artifact_digest'] and a['expired'] is False
          files={x.name for x in Path('/tmp/source-artifact').iterdir() if x.is_file()}; assert files=={'resolved-source-run-provenance.json'}
          prov=json.loads(Path('/tmp/source-artifact/resolved-source-run-provenance.json').read_text())
          assert prov['repository_sha']==p['source_reviewed_head'] and prov['workflow_run_id']==w['run_id'] and prov['job_id']==w['job_id']
          assert prov['evidence_id']=='message_protection_key_authority_and_historical_verifier_continuity' and prov['message_protection_authority']=='secret_or_kms_authority_with_historical_verifier_continuity'
          assert prov['current_run_auto_credit'] is False and prov['ledger_credit']==[] and prov['selection']=='not_selected' and prov['selection_authority']=='not_granted' and all(prov['proof_results'].values())
          assert hashlib.sha256(src.read_bytes()).hexdigest()==p['source_manifest']['sha256']==prov['source_manifest_sha256']
          print('d4d_third_credit_live_admission=PASS')
          PY
      - name: Assert third promotion remains bound inside cumulative D4-D ledger
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('implementation/d4-eventing-async/d4-d-evidence-plan.json').read_text()); state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text()); src=json.loads(Path('implementation/d4-eventing-async/source-evidence/d4-d-message-protection-key-authority/source-evidence-manifest.json').read_text()); p3=json.loads(Path('implementation/d4-eventing-async/ledger-promotions/d4-d-open-evt-017-message-protection-promotion-v1.json').read_text()); d=next(t for t in state['tracks'] if t['track_id']=='D4-D')
          current=['workload_identity_to_broker_credential_adapter_least_privilege','tenant_and_contract_scoped_producer_consumer_authorization','message_protection_key_authority_and_historical_verifier_continuity','secret_credential_payload_exclusion_and_erasure_boundary','trace_context_observability_only_validation_and_redaction']
          assert src['source_time_state']['d4d']=='2_of_5_unselected' and src['source_time_state']['d4wide']=='23_of_26' and src['ledger_credit']==[] and src['current_run_auto_credit'] is False
          assert p3['credited_evidence']==current[:3] and p3['credit_count']==3
          assert plan['ledger_credit_state']=='five_of_five' and plan['credited_evidence']==current and plan['remaining_evidence']==[] and d['evidence_completed']==current and d['evidence_remaining']==[]
          assert d['candidate']=={'workload_identity_to_broker_credential_adapter': 'derived_short_lived_broker_native_credential_adapter', 'tenant_and_contract_scoped_producer_consumer_authorization': 'broker_acl_projection_adapter', 'message_protection_key_authority_and_historical_verifier_continuity': 'kms_backed_envelope_or_transport_protection_profile', 'secret_credential_payload_exclusion_and_erasure_boundary': 'reference_only_secret_authority_profile', 'trace_context_observability_only_validation_and_redaction': 'w3c_trace_context_bounded_profile'} and d['candidate_status']=='selected_c2_security_profile' and d['state']=='selected_candidate'
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted' and state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted' and state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          print('d4d_third_credit_boundary=PASS source_snapshot=2_of_5 third_promotion=preserved current_d4d=5_of_5 d4wide=26_of_26 historical_selection=not_selected current_selection=selected_c2_security_profile authorities=unchanged')
          PY
