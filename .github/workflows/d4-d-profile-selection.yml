name: JLMIRROR D4-D Bounded C2 Security Profile Selection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/d4-d-selection-record.json'
      - 'implementation/d4-eventing-async/d4-d-evidence-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-workload-identity/source-evidence-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-tenant-contract-authorization/source-evidence-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-message-protection-key-authority/source-evidence-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-secret-credential-exclusion/source-evidence-manifest.json'
      - 'implementation/d4-eventing-async/source-evidence/d4-d-trace-context-observability/source-evidence-manifest.json'
      - 'tools/assurance/validate_d4d_selection.py'
      - 'tools/assurance/test_validate_d4d_selection.py'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/62-d4-d-bounded-c2-security-profile-selection.md'
      - '.github/workflows/d4-d-profile-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4d-profile-selection:
    name: D4-D bounded C2 security profile selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRESELECTION_MAIN: 4b76249e351a1fe18e425541af6d10ae540b0af1
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit and immutable historical evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$PRESELECTION_MAIN^{commit}"
          git diff --exit-code "$PRESELECTION_MAIN" -- \
            implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json \
            implementation/d4-eventing-async/source-evidence/d4-d-workload-identity/source-evidence-manifest.json \
            implementation/d4-eventing-async/source-evidence/d4-d-tenant-contract-authorization/source-evidence-manifest.json \
            implementation/d4-eventing-async/source-evidence/d4-d-message-protection-key-authority/source-evidence-manifest.json \
            implementation/d4-eventing-async/source-evidence/d4-d-secret-credential-exclusion/source-evidence-manifest.json \
            implementation/d4-eventing-async/source-evidence/d4-d-trace-context-observability/source-evidence-manifest.json
      - name: Compile selection assurance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/assurance/validate_d4d_selection.py \
            tools/assurance/test_validate_d4d_selection.py \
            tools/assurance/validate_d4_eventing_async_state.py \
            tools/assurance/test_validate_d4_eventing_async_state.py
      - name: Falsify D4-D selection weakening
        shell: bash
        run: python3 tools/assurance/test_validate_d4d_selection.py
      - name: Validate selected D4-D security profile
        shell: bash
        run: python3 tools/assurance/validate_d4d_selection.py .
      - name: Preserve global D4 scoped state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contracts
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Assert exact selected profiles and no authority escalation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          selection=json.loads(Path('implementation/d4-eventing-async/d4-d-selection-record.json').read_text())
          ledger=json.loads(Path('implementation/d4-eventing-async/d4-d-evidence-plan.json').read_text())
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          evaluation=json.loads(Path('implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json').read_text())
          expected_d={
            'workload_identity_to_broker_credential_adapter':'derived_short_lived_broker_native_credential_adapter',
            'tenant_and_contract_scoped_producer_consumer_authorization':'broker_acl_projection_adapter',
            'message_protection_key_authority_and_historical_verifier_continuity':'kms_backed_envelope_or_transport_protection_profile',
            'secret_credential_payload_exclusion_and_erasure_boundary':'reference_only_secret_authority_profile',
            'trace_context_observability_only_validation_and_redaction':'w3c_trace_context_bounded_profile',
          }
          expected_c={'ack_visibility_lease_and_checkpoint':'durable_inbox_claim_then_broker_ack_profile','quarantine_and_redrive':'hybrid_platform_quarantine_store_plus_broker_dlq','bounded_message_payload_batch_and_compression':'layered_transport_and_application_bounds_profile','scoped_content_equivalence_authority':'hybrid_equivalence_authority_profile','outbox_claim_dispatch_and_ack_ambiguity':'compare_and_swap_lease_claim_profile','producer_source_generation':'authority_issued_epoch_generation','privileged_replay_and_event_history':'hybrid_history_archive_plus_replay_controller_profile','historical_reader_and_upcaster':'in_process_versioned_reader_upcaster_registry','recovery_generation_reconciliation_and_activation':'hybrid_generation_manifest_plus_multi_store_reconciler_profile'}
          tracks={t['track_id']:t for t in state['tracks']}
          assert selection['selection_state']=='selected' and selection['selection_scope']=='bounded_c2_security_profile_selection_only'
          assert ledger['candidate']==expected_d and ledger['candidate_status']=='selected_c2_security_profile' and ledger['selection_state']=='selected'
          assert tracks['D4-D']['candidate']==expected_d and tracks['D4-D']['candidate_status']=='selected_c2_security_profile' and tracks['D4-D']['state']=='selected_candidate'
          assert len(tracks['D4-D']['evidence_completed'])==5 and tracks['D4-D']['evidence_remaining']==[]
          assert evaluation['selection_state']=='not_selected' and evaluation['selection_authority']=='not_granted'
          assert tracks['D4-C']['candidate']==expected_c and tracks['D4-C']['candidate_status']=='selected_c2_delivery_recovery_profile' and tracks['D4-C']['state']=='selected_candidate' and len(tracks['D4-C']['evidence_completed'])==9 and tracks['D4-C']['evidence_remaining']==[]
          assert sum(len(t['evidence_completed']) for t in state['tracks'])==26
          assert state['gate_state']=='scoped' and state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted' and state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none' and state['c3_numeric_topology_authority']=='not_selected'
          assert selection['separate_d4_acceptance_required'] is True
          print('d4d_selection_boundary=PASS profile=selected_c2_security_profile evidence=5/5 d4wide=26/26 d4c=9/9_selected d4=scoped acceptance=separate authorities=unchanged')
          PY
