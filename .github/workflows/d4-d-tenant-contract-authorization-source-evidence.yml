name: JLMIRROR D4-D Tenant Contract Authorization Source Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/source-evidence/d4-d-tenant-contract-authorization/**'
      - 'implementation/d4-eventing-async/d4-d-candidate-evaluation-plan.json'
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/d4d_tenant_contract_authorization_source.py'
      - 'tools/assurance/validate_d4d_tenant_contract_authorization_source.py'
      - 'tools/assurance/test_validate_d4d_tenant_contract_authorization_source.py'
      - 'tools/assurance/emit_d4d_tenant_contract_authorization_source_provenance.py'
      - 'docs/16-implementation-readiness/58-d4-d-open-evt-016-tenant-contract-authorization-source-evidence.md'
      - '.github/workflows/d4-d-tenant-contract-authorization-source-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-evidence:
    name: D4-D tenant contract authorization source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ANALYZED_SHA }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Verify exact commit identity
        run: test "$(git rev-parse HEAD)" = "$ANALYZED_SHA"
      - name: Compile source evidence tooling
        run: python3 -m py_compile tools/assurance/d4d_tenant_contract_authorization_source.py tools/assurance/validate_d4d_tenant_contract_authorization_source.py tools/assurance/test_validate_d4d_tenant_contract_authorization_source.py tools/assurance/emit_d4d_tenant_contract_authorization_source_provenance.py
      - name: Execute tenant contract authorization probes
        run: python3 tools/assurance/d4d_tenant_contract_authorization_source.py
      - name: Falsify source-evidence weakening
        run: python3 tools/assurance/test_validate_d4d_tenant_contract_authorization_source.py
      - name: Validate source evidence remains non-promoting
        run: python3 tools/assurance/validate_d4d_tenant_contract_authorization_source.py .
      - name: Preserve global D4 state
        run: |
          python3 tools/assurance/test_validate_d4_eventing_async_state.py
          python3 tools/assurance/validate_d4_eventing_async_state.py .
      - name: Preserve Phase 10 contract tooling
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'
      - name: Resolve exact workflow job identity and emit immutable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o runtime-evidence/jobs.json
          job_id="$(python3 - <<'PY'
          import json
          jobs=json.load(open('runtime-evidence/jobs.json',encoding='utf-8'))['jobs']
          matches=[j for j in jobs if j['name']=='D4-D tenant contract authorization source evidence']
          if len(matches)!=1: raise SystemExit(f'expected one D4-D tenant contract source job, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          python3 tools/assurance/emit_d4d_tenant_contract_authorization_source_provenance.py \
            --repository-sha "${ANALYZED_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job-id "$job_id" \
            --job-name "D4-D tenant contract authorization source evidence" \
            --output runtime-evidence/resolved-source-run-provenance.json
          rm runtime-evidence/jobs.json
      - name: Persist exact source-run provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-d-tenant-contract-authorization-source-${{ env.ANALYZED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/resolved-source-run-provenance.json
          if-no-files-found: error
          retention-days: 90
