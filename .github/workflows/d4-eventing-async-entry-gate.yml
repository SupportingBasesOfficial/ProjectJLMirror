name: JLMIRROR D4 Eventing Async C2 Entry Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-entry:
    name: D4 scoped mechanism authority boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile D4 assurance tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/assurance/validate_d4_eventing_async_state.py tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Falsify D4 scoped-state governance
        shell: bash
        run: python3 tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Validate machine-owned D4 scoped state
        shell: bash
        run: python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve accepted Phase 10 contract tooling
        shell: bash
        run: python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Preserve D4 non-authority boundary after D4-A selection and D4-B evidence promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          selection = json.loads(Path('implementation/d4-eventing-async/d4-a-selection-record.json').read_text())
          tracks = {track['track_id']: track for track in state['tracks']}
          d4a = tracks['D4-A']
          d4b = tracks['D4-B']
          expected_d4a = {
              'capacity_envelope_baseline_growth_stress',
              'broker_neutral_anti_corruption_stub_swap',
              'regulated_payload_erasure_granularity',
              'exactly_once_guardrail_consumer_inbox_enforcement',
              'ordering_scope_partition_mapping_ceiling_tenant_cohort_fallback_and_key_level_concurrency',
              'physical_naming_routing_and_cell_topology_adapter_mapping',
              'broker_outbox_dispatch_priority_preserving_backlog_drain_recovery_benchmark',
          }
          expected_d4b = {
              'canonical_bounded_serialization_profile',
              'parser_ambiguity_and_duplicate_field_negative_vectors',
              'schema_catalog_semantic_manifest_compatibility_ci',
              'historical_reader_and_equivalence_profile_continuity',
              'contract_version_representation_and_breaking_change_vectors',
          }
          assert state['gate_state'] == 'scoped'
          assert state['d4_transport_authority'] == 'selected_not_granted'
          assert state['canonical_product_implementation_authority'] == 'not_granted'
          assert state['wave4_implementation_authority'] == 'not_granted'
          assert state['production_authority'] == 'none'
          assert state['c3_numeric_topology_authority'] == 'not_selected'
          assert d4a['candidate'] == 'kafka'
          assert d4a['candidate_status'] == 'selected_c2_candidate'
          assert d4a['state'] == 'selected_candidate'
          assert set(d4a['evidence_completed']) == expected_d4a
          assert d4a['evidence_remaining'] == []
          assert selection['selection_state'] == 'selected'
          assert selection['selection_scope'] == 'bounded_c2_mechanism_selection_only'
          assert selection['separate_d4_acceptance_required'] is True
          assert d4b['candidate'] is None and d4b['candidate_status'] == 'not_selected'
          assert d4b['state'] == 'evidence_complete_selection_pending'
          assert set(d4b['evidence_completed']) == expected_d4b
          assert d4b['evidence_remaining'] == []
          assert all(tracks[track_id]['evidence_completed'] == [] for track_id in ('D4-C', 'D4-D'))
          assert all(tracks[track_id]['candidate'] is None and tracks[track_id]['candidate_status'] == 'not_selected' for track_id in ('D4-C', 'D4-D'))
          assert sum(len(track['evidence_completed']) for track in state['tracks']) == 12
          print('d4_scoped_boundary=PASS d4a=kafka_selected_7_of_7 d4b=5_of_5_selection_pending candidate=not_selected evidence_credited=12 transport_authority=not_granted wave4=not_granted production=none c3=not_selected d4c_d=open')
          PY
