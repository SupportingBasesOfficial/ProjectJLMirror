name: JLMIRROR D4 Eventing Async Separate Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'implementation/d4-eventing-async/state-manifest.json'
      - 'tools/assurance/validate_d4_eventing_async_state.py'
      - 'tools/assurance/test_validate_d4_eventing_async_state.py'
      - 'docs/16-implementation-readiness/64-d4-eventing-async-transport-c2-acceptance-propagation.md'
      - '.github/workflows/d4-eventing-async-separate-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-separate-acceptance:
    name: D4 separate acceptance authority boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ANALYZED_SHA }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ANALYZED_SHA}"

      - name: Falsify accepted D4 gate and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/test_validate_d4_eventing_async_state.py

      - name: Validate separately accepted D4 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assurance/validate_d4_eventing_async_state.py .

      - name: Preserve Phase 10 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover tools/contracts/tests -p 'test_*.py'

      - name: Assert acceptance is not implementation authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('implementation/d4-eventing-async/state-manifest.json').read_text())
          tracks={t['track_id']:t for t in state['tracks']}
          assert state['gate_state']=='separately_accepted'
          assert set(tracks)=={'D4-A','D4-B','D4-C','D4-D'}
          assert all(t['state']=='selected_candidate' for t in tracks.values())
          assert sum(len(t['evidence_completed']) for t in tracks.values())==26
          assert all(t['evidence_remaining']==[] for t in tracks.values())
          assert state['d4_transport_authority']=='selected_not_granted'
          assert state['canonical_product_implementation_authority']=='not_granted'
          assert state['wave4_implementation_authority']=='not_granted'
          assert state['production_authority']=='none'
          assert state['c3_numeric_topology_authority']=='not_selected'
          print('d4_separate_acceptance=PASS evidence=26/26 tracks=terminal_selected gate=accepted transport_implementation=not_granted product_wave4=not_granted production=none c3=not_selected')
          PY
