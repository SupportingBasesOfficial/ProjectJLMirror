name: JLMIRROR Deterministic Assurance

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-assurance:
    name: Deterministic assurance v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Falsify validator policy
        shell: bash
        run: python3 tools/assurance/test_validate_repository.py

      - name: Validate repository
        shell: bash
        run: python3 tools/assurance/validate_repository.py .

      - name: Falsify contract tooling reference models
        shell: bash
        run: python3 -m unittest discover -s tools/contracts/tests -p 'test_*.py'

      - name: Validate contract tooling projections
        shell: bash
        run: python3 tools/contracts/validate_contracts.py .

      - name: Falsify Wave 1 identity and authority skeleton
        shell: bash
        run: PYTHONPATH=src python3 -m unittest discover -s tests/wave1 -p 'test_*.py'

      - name: Validate Wave 1 authority boundaries
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_wave1.py

      - name: Validate Wave 1 final admission authority
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_final_admission.py

      - name: Validate Wave 1 storage access conformance
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_wave1_privileges.py

      - name: Validate Wave 1 fence revalidation safety
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_fence_revalidation_safety.py

      - name: Validate Wave 1 fence logical replication authority
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_fence_publication_safety.py

      - name: Validate Wave 1 publication guard control-flow structure
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_publication_guard_structure.py

      - name: Validate Wave 1 publication guard ancestry
        shell: bash
        run: PYTHONPATH=src python3 tools/authority/validate_publication_guard_ancestry.py

      - name: Falsify Wave 2 transactional and async correctness
        shell: bash
        run: PYTHONPATH=src python3 -m unittest discover -s tests/wave2 -p 'test_*.py'

      - name: Validate accepted Wave 2 correctness across future waves
        shell: bash
        run: PYTHONPATH=src python3 tools/wave3/validate_accepted_wave2_compatibility.py

      - name: Validate Wave 2 reconciliation attempt binding
        shell: bash
        run: PYTHONPATH=src python3 tools/async_core/validate_reconciliation_attempt_binding.py

      - name: Validate Wave 2 quarantine redrive authority
        shell: bash
        run: PYTHONPATH=src python3 tools/async_core/validate_redrive_authority.py

      - name: Falsify Wave 3 observability and release chain
        shell: bash
        run: PYTHONPATH=src python3 -m unittest discover -s tests/wave3 -p 'test_*.py'

      - name: Validate Wave 3 observability and release boundaries
        shell: bash
        run: PYTHONPATH=src python3 tools/wave3/validate_wave3.py

      - name: Validate Wave 3 pre-effect runtime requirement authority
        shell: bash
        run: PYTHONPATH=src python3 tools/wave3/validate_runtime_requirement_authority.py

      - name: Validate Wave 3 runtime profile reliability authority
        shell: bash
        run: PYTHONPATH=src python3 tools/wave3/validate_runtime_profile_reliability.py
