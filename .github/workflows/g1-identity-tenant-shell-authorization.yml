name: JLMIRROR G1 Identity Tenant Shell Authorization

on:
  pull_request:
    paths:
      - 'implementation/g1-identity-tenant-shell-authorization/**'
      - 'tools/assurance/validate_g1_identity_tenant_shell_authorization.py'
      - 'tools/assurance/test_validate_g1_identity_tenant_shell_authorization.py'
      - 'governance/adversarial/learning-ledger.d/pr-153-g1-authorization-review-findings.json'
      - '.github/workflows/g1-identity-tenant-shell-authorization.yml'
      - 'implementation/wave-1/AUTHORITY_BOUNDARY.md'
      - 'docs/00-foundation/ai-e2e-delivery/**'
      - 'docs/07-system-design/request-auth-and-authorization-lifecycle.md'
      - 'docs/09-api-contracts/authentication-authorization-and-tenant-context.md'
      - 'docs/09-api-contracts/surface-routing-and-resource-identity.md'
      - 'docs/16-implementation-readiness/20-d3-identity-security-acceptance-propagation.md'
  push:
    branches: [main]
    paths:
      - 'implementation/g1-identity-tenant-shell-authorization/**'
      - 'tools/assurance/validate_g1_identity_tenant_shell_authorization.py'
      - 'tools/assurance/test_validate_g1_identity_tenant_shell_authorization.py'
      - 'governance/adversarial/learning-ledger.d/pr-153-g1-authorization-review-findings.json'
      - '.github/workflows/g1-identity-tenant-shell-authorization.yml'
      - 'implementation/wave-1/AUTHORITY_BOUNDARY.md'
      - 'docs/00-foundation/ai-e2e-delivery/**'
      - 'docs/07-system-design/request-auth-and-authorization-lifecycle.md'
      - 'docs/09-api-contracts/authentication-authorization-and-tenant-context.md'
      - 'docs/09-api-contracts/surface-routing-and-resource-identity.md'
      - 'docs/16-implementation-readiness/20-d3-identity-security-acceptance-propagation.md'

permissions:
  contents: read

jobs:
  g1-authorization:
    runs-on: ubuntu-24.04
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Resolve exact analyzed HEAD
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate G1 authorization
        run: python3 tools/assurance/validate_g1_identity_tenant_shell_authorization.py

      - name: Falsify G1 authorization boundaries
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_g1_identity_tenant_shell_authorization.py

      - name: Validate repository structure and workflow safety
        run: python3 tools/assurance/validate_repository.py
