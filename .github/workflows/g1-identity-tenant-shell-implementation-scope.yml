name: JLMIRROR G1 Identity Tenant Shell Implementation Scope

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  g1-implementation-scope:
    if: github.event.issue.pull_request && github.event.comment.body == '/jlmirror-g1-scope-attest'
    runs-on: ubuntu-24.04
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      G1_SCOPE_COMMAND: /jlmirror-g1-scope-attest
      G1_SCOPE_VALIDATOR: tools/assurance/validate_g1_identity_tenant_shell_implementation_scope.py
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Resolve exact PR coordinates from GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_STATE="$(jq -r '.state' <<<"$pr_json")"
          PR_BASE_SHA="$(jq -r '.base.sha' <<<"$pr_json")"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<<"$pr_json")"
          PR_BASE_REF="$(jq -r '.base.ref' <<<"$pr_json")"
          PR_HEAD_REF="$(jq -r '.head.ref' <<<"$pr_json")"
          PR_BASE_REPO="$(jq -r '.base.repo.full_name' <<<"$pr_json")"
          PR_HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          PR_LABELS_JSON="$(jq -c '[.labels[].name]' <<<"$pr_json")"
          test "$PR_STATE" = "open"
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          test -n "$PR_BASE_REF"
          test -n "$PR_HEAD_REF"
          test -n "$PR_BASE_REPO"
          test -n "$PR_HEAD_REPO"
          test -n "$PR_LABELS_JSON"
          {
            printf 'PR_BASE_SHA=%s\n' "$PR_BASE_SHA"
            printf 'PR_HEAD_SHA=%s\n' "$PR_HEAD_SHA"
            printf 'PR_BASE_REF=%s\n' "$PR_BASE_REF"
            printf 'PR_HEAD_REF=%s\n' "$PR_HEAD_REF"
            printf 'PR_BASE_REPO=%s\n' "$PR_BASE_REPO"
            printf 'PR_HEAD_REPO=%s\n' "$PR_HEAD_REPO"
            printf 'PR_LABELS_JSON=%s\n' "$PR_LABELS_JSON"
          } >> "$GITHUB_ENV"
          echo "trusted_scope_pr=${PR_NUMBER} base=${PR_BASE_SHA} head=${PR_HEAD_SHA}"

      - name: Fetch exact base and candidate objects as data only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          test "$(git rev-parse HEAD)" != "$PR_HEAD_SHA"

      - name: Materialize trusted evaluator from exact PR base object
        shell: bash
        run: |
          set -euo pipefail
          trusted_validator="$RUNNER_TEMP/g1-implementation-scope-validator.py"
          git show "${PR_BASE_SHA}:${G1_SCOPE_VALIDATOR}" > "$trusted_validator"
          test -s "$trusted_validator"
          printf 'TRUSTED_VALIDATOR=%s\n' "$trusted_validator" >> "$GITHUB_ENV"

      - name: Enforce exact G1 scope on explicitly attested PR
        shell: bash
        run: |
          set -euo pipefail
          python3 "$TRUSTED_VALIDATOR" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --head-ref "$PR_HEAD_REF" \
            --labels-json "$PR_LABELS_JSON" \
            --head-repo "$PR_HEAD_REPO" \
            --base-repo "$PR_BASE_REPO"
          echo "g1_trusted_scope_attestation=PASS pr=${PR_NUMBER} exact_head=${PR_HEAD_SHA} caller=default_branch_issue_comment"
