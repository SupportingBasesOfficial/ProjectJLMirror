name: JLMIRROR G1 Identity Tenant Shell Implementation Scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  g1-implementation-scope:
    runs-on: ubuntu-24.04
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Resolve exact PR coordinates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          test -n "$PR_HEAD_REF"
          test -n "$PR_BASE_REPO"
          test -n "$PR_HEAD_REPO"
          test -n "$PR_LABELS_JSON"

      - name: Checkout trusted exact PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Checkout candidate exact PR HEAD as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify trusted base and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trusted-base rev-parse HEAD)" = "$PR_BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PR_HEAD_SHA"
          git -C candidate cat-file -e "${PR_BASE_SHA}^{commit}"

      - name: Enforce canonical G1 implementation path policy from trusted base code
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted-base/tools/assurance/validate_g1_identity_tenant_shell_implementation_scope.py" \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --head-ref "$PR_HEAD_REF" \
            --labels-json "$PR_LABELS_JSON" \
            --head-repo "$PR_HEAD_REPO" \
            --base-repo "$PR_BASE_REPO"
