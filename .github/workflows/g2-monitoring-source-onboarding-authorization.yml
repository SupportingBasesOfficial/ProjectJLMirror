name: JLMIRROR G2 Monitoring Source Onboarding Authorization

on:
  pull_request:
    paths:
      - 'implementation/g2-monitoring-source-onboarding-authorization/**'
      - 'tools/assurance/g2_scope_core.py'
      - 'tools/assurance/g2_authorization_core.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_authorization.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_authorization.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_implementation_scope.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_implementation_scope.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_scope_readiness.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_scope_readiness.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_review_guardrails.py'
      - 'governance/adversarial/learning-ledger.d/pr-154-g2-authorization-review-findings.json'
      - 'tools/assurance/validate_repository.py'
      - '.github/workflows/g2-monitoring-source-onboarding-authorization.yml'
      - '.github/workflows/g2-monitoring-source-onboarding-implementation-scope.yml'
      - 'implementation/g1-identity-tenant-shell-authorization/AUTHORIZATION_MANIFEST.json'
      - 'docs/03-domains/monitoring-domain-contract.md'
      - 'docs/09-api-contracts/monitoring-domain-api-contract.md'
      - 'docs/09-api-contracts/zabbix-monitoring-source-provider-contract.md'
      - 'docs/16-implementation-readiness/16-wave-4-monitoring-entry-gate.md'
      - 'implementation/wave-4/STATE.md'
      - 'docs/00-foundation/ai-e2e-delivery/**'
  push:
    branches: [main]
    paths:
      - 'implementation/g2-monitoring-source-onboarding-authorization/**'
      - 'tools/assurance/g2_scope_core.py'
      - 'tools/assurance/g2_authorization_core.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_authorization.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_authorization.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_implementation_scope.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_implementation_scope.py'
      - 'tools/assurance/validate_g2_monitoring_source_onboarding_scope_readiness.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_scope_readiness.py'
      - 'tools/assurance/test_validate_g2_monitoring_source_onboarding_review_guardrails.py'
      - 'governance/adversarial/learning-ledger.d/pr-154-g2-authorization-review-findings.json'
      - 'tools/assurance/validate_repository.py'
      - '.github/workflows/g2-monitoring-source-onboarding-authorization.yml'
      - '.github/workflows/g2-monitoring-source-onboarding-implementation-scope.yml'
      - 'implementation/g1-identity-tenant-shell-authorization/AUTHORIZATION_MANIFEST.json'
      - 'docs/03-domains/monitoring-domain-contract.md'
      - 'docs/09-api-contracts/monitoring-domain-api-contract.md'
      - 'docs/09-api-contracts/zabbix-monitoring-source-provider-contract.md'
      - 'docs/16-implementation-readiness/16-wave-4-monitoring-entry-gate.md'
      - 'implementation/wave-4/STATE.md'
      - 'docs/00-foundation/ai-e2e-delivery/**'

permissions:
  contents: read

jobs:
  g2-authorization:
    runs-on: ubuntu-24.04
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Resolve exact analyzed HEAD
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate G2 authorization
        run: python3 tools/assurance/validate_g2_monitoring_source_onboarding_authorization.py

      - name: Falsify G2 authorization boundaries
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_g2_monitoring_source_onboarding_authorization.py

      - name: Falsify future G2 implementation diff scope
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_g2_monitoring_source_onboarding_implementation_scope.py

      - name: Falsify trusted G2 readiness evidence
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_g2_monitoring_source_onboarding_scope_readiness.py

      - name: Falsify G2 external-review guardrails
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_g2_monitoring_source_onboarding_review_guardrails.py

      - name: Validate repository structure and workflow safety
        run: python3 tools/assurance/validate_repository.py