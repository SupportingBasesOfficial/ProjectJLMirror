name: JLMIRROR G6 Monitoring Alerting Transport Authorization

on:
  pull_request:
    paths:
      - 'implementation/g6-monitoring-alerting-transport-authorization/**'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_authorization.py'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_implementation_scope.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_authorization.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_implementation_scope.py'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_scope_readiness.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_scope_readiness.py'
      - '.github/workflows/g6-monitoring-alerting-transport-authorization.yml'
      - '.github/workflows/g6-monitoring-alerting-transport-implementation-scope.yml'
      - 'tools/assurance/validate_repository.py'
      - 'implementation/wave-4-monitoring-alerting-publication-authorization/**'
      - 'implementation/wave-4-monitoring-alerting-publication-runtime/**'
      - 'docs/10-event-contracts/monitoring-domain-event-contracts.md'
      - 'sql/wave2/001_async_correctness.sql'
      - 'implementation/wave-4-alerting-core-model-authorization/**'
      - 'docs/00-foundation/ai-e2e-delivery/**'
  push:
    branches:
      - main
      - governance/g6-monitoring-alerting-transport-authorization
    paths:
      - 'implementation/g6-monitoring-alerting-transport-authorization/**'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_authorization.py'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_implementation_scope.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_authorization.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_implementation_scope.py'
      - 'tools/assurance/validate_g6_monitoring_alerting_transport_scope_readiness.py'
      - 'tools/assurance/test_validate_g6_monitoring_alerting_transport_scope_readiness.py'
      - '.github/workflows/g6-monitoring-alerting-transport-authorization.yml'
      - '.github/workflows/g6-monitoring-alerting-transport-implementation-scope.yml'
      - 'tools/assurance/validate_repository.py'
      - 'implementation/wave-4-monitoring-alerting-publication-authorization/**'
      - 'implementation/wave-4-monitoring-alerting-publication-runtime/**'
      - 'docs/10-event-contracts/monitoring-domain-event-contracts.md'
      - 'sql/wave2/001_async_correctness.sql'
      - 'implementation/wave-4-alerting-core-model-authorization/**'
      - 'docs/00-foundation/ai-e2e-delivery/**'

permissions:
  contents: read

jobs:
  g6-authorization:
    runs-on: ubuntu-24.04
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Resolve exact analyzed HEAD
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate G6 authorization
        run: python3 tools/assurance/validate_g6_monitoring_alerting_transport_authorization.py

      - name: Falsify G6 authorization boundaries
        run: python3 tools/assurance/test_validate_g6_monitoring_alerting_transport_authorization.py

      - name: Falsify future G6 implementation scope
        run: python3 tools/assurance/test_validate_g6_monitoring_alerting_transport_implementation_scope.py

      - name: Falsify trusted G6 readiness evidence
        run: python3 tools/assurance/test_validate_g6_monitoring_alerting_transport_scope_readiness.py

      - name: Validate repository structure and workflow safety
        run: python3 tools/assurance/validate_repository.py
