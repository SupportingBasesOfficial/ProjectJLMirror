name: JLMIRROR OPEN-REL-030 Conformance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-rel-030-conformance:
    name: OPEN-REL-030 bounded C2 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate evidence harness structure
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/open_rel_030/run_conformance.sh
          bash -n tools/open_rel_030/run_conformance_extended.sh
          bash -n tools/open_rel_030/tier1_commit_ambiguity.sh
          bash -n tools/open_rel_030/timescale_jobs_restore.sh
          bash -n tools/open_rel_030/physical_pitr.sh
          bash -n tools/open_rel_030/physical_pitr_post_enrollment_clone.sh
          bash -n tools/open_rel_030/tenant_relocation.sh
          test -s sql/d2-open-rel-030/012_timescale_restore_role_bootstrap.sql
          python3 -m py_compile tools/open_rel_030/tier1_concurrency.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('implementation/d2-open-rel-030/EVIDENCE_MANIFEST.json').read_text())
          assert manifest['decision'] == 'OPEN-REL-030'
          assert manifest['class'] == 'C2_bounded_spike'
          assert manifest['production_authority'] == 'none'
          assert manifest['product_feature_activation'] == 'none'
          assert manifest['wave4_implementation_authorization'] == 'not_granted'
          assert manifest['evidence_state'] == 'complete_ready_for_decision_review'
          assert manifest['closure_claim'] is False
          assert manifest['acceptance_authorization'] == 'not_granted'
          assert manifest['production_versions_selected'] is False
          assert manifest['production_capacity_numerics_selected'] is False
          assert manifest['production_capacity_owner'] == 'OPEN-REL-020'
          assert len(manifest['completed_mandatory_vectors']) == 8
          assert manifest['mandatory_vectors_not_yet_claimed_complete'] == []
          assert manifest['tier2_profile_classification']['mediated_shared_history_columnstore_cagg'] == 'conformant_candidate_recommended_for_c2_acceptance'
          assert manifest['review_provenance']['material_finding_classes_documented_in_decision_review'] == 42

          recovery = manifest['recovery_evidence']

          # Post-enrollment clone authority + evidence-quality guards (#38/#39).
          assert recovery['post_enrollment_clone_vector'] is True
          assert recovery['post_enrollment_same_database_instance_id'] is True
          assert recovery['post_enrollment_same_external_credential'] is True
          assert recovery['post_enrollment_effective_capability_is_copied_by_pgdata_clone'] is False
          assert recovery['post_enrollment_local_capability_fingerprints_present_and_distinct'] is True
          assert recovery['post_enrollment_clone_positive_control_claim'] is True
          assert recovery['post_enrollment_clone_positive_control_verify'] is True
          assert recovery['post_enrollment_clone_positive_control_principal_binding'] is True
          assert recovery['post_enrollment_clone_positive_control_database_id_binding'] is True
          assert recovery['post_enrollment_clone_positive_control_fingerprint_binding'] is True
          assert recovery['post_enrollment_clone_capability_path_operational_before_negative'] is True
          assert recovery['post_enrollment_pgdata_clone_claim'] is False
          assert recovery['post_enrollment_pgdata_clone_verify'] is False
          assert recovery['post_enrollment_legitimate_same_instance_retry'] is True
          assert recovery['post_enrollment_primary_capability_fingerprint_binding'] is True
          assert recovery['post_enrollment_negative_is_not_broken_path_false_pass'] is True
          assert recovery['pgdata_copy_alone_duplicates_recovery_authority'] is False

          # Recovery boundary/effect/deadline guards (#40/#41/#42).
          assert recovery['single_winner_keyed_by_recovery_boundary'] is True
          assert recovery['multiple_grant_ids_same_boundary_create_multiple_authorities'] is False
          assert recovery['same_winner_retry_through_equivalent_grant_id'] is True
          assert recovery['cross_grant_boundary_race_exactly_one_winner'] is True
          assert recovery['cross_grant_boundary_race_claim_rows'] == 1
          assert recovery['surviving_effect_evidence_authenticated'] is True
          assert recovery['surviving_effect_canonicalized_and_hmac_authenticated'] is True
          assert recovery['grant_binds_effect_digest'] is True
          assert recovery['claim_without_effect_application_leaves_restore_at_r'] is True
          assert recovery['local_reconciled_state_derived_from_verified_effect'] is True
          assert recovery['verified_effect_application_is_local_atomic_mutation'] is True
          assert recovery['local_self_minted_receipt_admits'] is False
          assert recovery['claim_verify_fetch_use_async_local_deadline'] is True
          assert recovery['connect_timeout_is_only_connection_setup_bound'] is True
          assert recovery['established_peer_blackhole_fails_closed_under_local_deadline'] is True
          assert recovery['duplicate_restored_authority_admitted'] is False

          runner = Path('tools/open_rel_030/run_conformance_extended.sh').read_text()
          history_modules = sorted(Path('sql/d2-open-rel-030').glob('00[4-9]_history_*.sql'))
          assert history_modules, 'history hardening module set is unexpectedly empty'
          missing = [p.name for p in history_modules if p.name not in runner]
          assert not missing, f'history hardening modules not wired into extended runner: {missing}'

          required_vectors = [
              'physical_pitr.sh',
              'physical_pitr_post_enrollment_clone.sh',
              'tenant_relocation.sh',
          ]
          missing_vectors = [name for name in required_vectors if name not in runner]
          assert not missing_vectors, f'critical extended vectors not wired into runner: {missing_vectors}'

          pitr = Path('tools/open_rel_030/physical_pitr.sh').read_text()
          required_recovery_markers = [
              'physical_pitr_surviving_effect_evidence_published=PASS',
              'physical_pitr_recovery_cross_grant_boundary_single_winner_race=PASS',
              'physical_pitr_recovery_single_winner_per_boundary_across_grant_ids=PASS',
              'physical_pitr_recovery_helpers_use_bounded_transport=PASS',
              'physical_pitr_recovery_stalled_peer_fails_closed',
              'physical_pitr_claim_without_effect_application_stays_at_R',
              'physical_pitr_authenticated_effect_application',
              'physical_pitr_reconciled_from_authenticated_surviving_effect',
          ]
          missing_recovery_markers = [m for m in required_recovery_markers if m not in pitr]
          assert not missing_recovery_markers, f'recovery hardening markers missing from physical PITR vector: {missing_recovery_markers}'
          assert 'recovery_boundary_claim' in pitr
          assert 'boundary_fingerprint' in pitr
          assert 'recovery_effect' in pitr
          assert 'fetch_claimed_recovery_material' in pitr
          assert 'dblink_send_query' in pitr
          assert 'dblink_is_busy' in pitr
          assert 'dblink_cancel_query' in pitr

          print(
              'evidence_manifest_guard=PASS '
              'state=complete_ready_for_decision_review '
              'acceptance=not_granted '
              'material_findings=42 '
              'post_enrollment_clone_guard=true '
              'clone_positive_control_guard=true '
              'recovery_boundary_single_winner_guard=true '
              'surviving_effect_guard=true '
              'recovery_local_deadline_guard=true '
              f'history_modules={len(history_modules)} '
              f'critical_vectors={len(required_vectors)}'
          )
          PY

      - name: Run initial real PostgreSQL and Timescale falsification
        shell: bash
        run: bash tools/open_rel_030/run_conformance.sh

      - name: Run ambiguity recovery jobs capacity fresh-cluster restore PITR and relocation falsification
        shell: bash
        run: bash tools/open_rel_030/run_conformance_extended.sh
