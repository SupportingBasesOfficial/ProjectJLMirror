name: JLMIRROR Canonical Project Memory

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory:
    runs-on: ubuntu-24.04
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Resolve exact analyzed HEAD
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate canonical project memory
        run: python3 tools/project_memory/validate_project_memory.py

      - name: Test canonical project memory
        run: python3 -m unittest discover -s tests/project_memory -p 'test_*.py'

      - name: Falsify canonical project-memory guardrails
        run: PYTHONPATH=tools/assurance:tools/project_memory python3 tools/assurance/test_validate_d4c_selection.py

      - name: Validate repository structure and workflow safety
        run: python3 tools/assurance/validate_repository.py
