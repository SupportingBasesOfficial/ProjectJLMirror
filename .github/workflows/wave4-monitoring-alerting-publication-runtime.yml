name: Wave 4 Monitoring Alerting Publication Runtime

on:
  pull_request:
    paths:
      - 'sql/wave2/001_async_correctness.sql'
      - 'sql/wave4/**'
      - 'sql/integration/001_monitoring_alerting_publication.sql'
      - 'implementation/wave-4-monitoring-alerting-publication-runtime/**'
      - 'governance/adversarial/learning-ledger.d/pr-148*.json'
      - 'tools/assurance/test_validate_d4c_selection.py'
      - 'tools/wave4/validate_monitoring_alerting_publication_runtime.py'
      - 'tools/wave4/run_monitoring_alerting_publication_postgres_conformance.sh'
      - 'tools/wave4/run_monitoring_alerting_publication_acl_preflight_postgres_conformance.sh'
      - 'tools/wave4/run_monitoring_alerting_publication_recovery_proxy_postgres_conformance.sh'
      - 'tests/wave4/test_monitoring_alerting_publication_runtime.py'
      - '.github/workflows/wave4-monitoring-alerting-publication-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'sql/wave2/001_async_correctness.sql'
      - 'sql/wave4/**'
      - 'sql/integration/001_monitoring_alerting_publication.sql'
      - 'implementation/wave-4-monitoring-alerting-publication-runtime/**'
      - 'governance/adversarial/learning-ledger.d/pr-148*.json'
      - 'tools/assurance/test_validate_d4c_selection.py'
      - 'tools/wave4/validate_monitoring_alerting_publication_runtime.py'
      - 'tools/wave4/run_monitoring_alerting_publication_postgres_conformance.sh'
      - 'tools/wave4/run_monitoring_alerting_publication_acl_preflight_postgres_conformance.sh'
      - 'tools/wave4/run_monitoring_alerting_publication_recovery_proxy_postgres_conformance.sh'
      - 'tests/wave4/test_monitoring_alerting_publication_runtime.py'
      - '.github/workflows/wave4-monitoring-alerting-publication-runtime.yml'

permissions: {}

concurrency:
  group: wave4-monitoring-alerting-publication-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Resolve exact analyzed HEAD
        id: analyzed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            resolved_sha="$PR_HEAD_SHA"
          else
            resolved_sha="$EVENT_SHA"
          fi
          test -n "$resolved_sha"
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact analyzed HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.analyzed.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Verify exact commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.analyzed.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate Monitoring to Alerting publication runtime
        run: python3 tools/wave4/validate_monitoring_alerting_publication_runtime.py

      - name: Test Monitoring to Alerting publication runtime
        run: python3 -m unittest tests.wave4.test_monitoring_alerting_publication_runtime

      - name: Falsify permanent publication guardrails
        run: PYTHONPATH=tools/assurance python3 tools/assurance/test_validate_d4c_selection.py

      - name: Prove privileged function ACL preflight
        run: bash tools/wave4/run_monitoring_alerting_publication_acl_preflight_postgres_conformance.sh

      - name: Prove recovery trigger proxy rejection
        run: bash tools/wave4/run_monitoring_alerting_publication_recovery_proxy_postgres_conformance.sh

      - name: Execute composed PostgreSQL publication conformance
        run: bash tools/wave4/run_monitoring_alerting_publication_postgres_conformance.sh

      - name: Validate repository structure and workflow safety
        run: python3 tools/assurance/validate_repository.py
