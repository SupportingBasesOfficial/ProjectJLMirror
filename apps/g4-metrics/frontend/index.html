<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JLMIRROR Metrics</title>
</head>
<body>
  <main id="g4-metrics">
    <h1>Metrics</h1>
    <p id="state">Loading metrics…</p>
    <section>
      <h2>Definitions</h2>
      <ul id="definitions"></ul>
    </section>
    <section>
      <h2>Current values</h2>
      <ul id="current"></ul>
    </section>
    <section id="history" hidden>
      <h2>History</h2>
      <p id="completeness"></p>
      <ul id="history-items"></ul>
    </section>
  </main>
  <script type="module" src="/g4-app.mjs"></script>
</body>
</html>
