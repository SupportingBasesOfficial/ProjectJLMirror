[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jlmirror"
version = "0.1.0"
description = "JLMIRROR — enterprise-grade multi-tenant platform for infrastructure monitoring, operational intelligence, IT service management, automation, governance, and extensible integrations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SupportingBasesOfficial" }]

# Runtime dependencies for the API application layer.
# The domain primitives in src/ use only the Python standard library; these
# dependencies are required by the FastAPI application and persistence layer
# added to make the repository "clone & run".
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "psycopg[binary,pool]>=3.2,<3.3",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
    "ruff>=0.5,<0.6",
]

[project.scripts]
jlmirror-api = "app.main:run"
jlmirror-migrate = "scripts.migrate:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
exclude = ["tests*", "tools*", "docs*", "sql*", "implementation*", "governance*", "rfcs*", "adr*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
